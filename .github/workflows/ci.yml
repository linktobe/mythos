name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本以 .node-version 为准，与 Cloudflare Pages 保持一致
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # 数据校验 + 关系图布局 + astro check（类型错误会挡住路由改造）
      - run: npm run check
