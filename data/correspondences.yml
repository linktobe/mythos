# 跨体系对照表
#
# 只登记不同体系之间「同一个位置上的两个角色」，不参与 relations 计算。
# relations 的校验前提是 target 与本词条同体系；跨体系对照混进 relations 会破坏
# 关系图，也会破坏对称去重，所以单列一张表、单用一种类型。
#
# type 取值：
#   对应    两套神话里功能相当、常被译者互相套用的角色（宙斯 ↔ 朱庇特）
#   等同    同一名号在不同语言里的两种写法，严格说是同一存在
#   影响    有文献支持的借用关系（一处明显取自另一处）
#
# 目前北欧是唯一上线体系，故本表为空。加入第二套体系后再填。
# 示例：
#   - from: greco-roman/zeus
#     to: greco-roman/jupiter
#     type: 等同
#     note: 罗马人直接以自己的朱庇特对应希腊宙斯，称谓不同，神格未变。
[]
