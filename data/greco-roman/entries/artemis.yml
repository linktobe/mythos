id: artemis
pantheon: greco-roman
entity_type: 神祇
name: 阿提密斯
name_original: "Artemis"
aliases: [阿尔忒弥斯, 狩猎女神]
counterpart:
  name: 黛安娜
  name_original: Diana
summary: 掌狩猎、野兽与分娩的女神，阿波罗的双生姐姐。她终身不嫁，谁越过她划的界线，谁就变成猎物。
role:
  title: "她护的是野兽，射的是人"
  brief: "山林、野兽、初生的婴儿都归她管。她的惩罚从不讲道理，也不给申诉：看见她洗澡的变成鹿，夸口胜过她母亲的失去子女。"
identity:
  lineage:
    - { id: olympian }
  camp:
    - { id: olympus }
  realm:
    - { id: earth }
narrative:
  - text: 她是勒托的长女。母亲被赫拉追着不许生产，最后在得洛斯落脚；她先出世，随即帮母亲接生弟弟阿波罗，因此也被奉为分娩的主保。
    refs: [theogony, homeric-hymns]
    at: { theogony: "918–920", homeric-hymns: "3" }
  - text: 荷马颂歌说，有三位女神始终不受阿芙罗黛蒂的力——雅典娜、阿提密斯与赫斯缇雅。阿提密斯向宙斯求得的礼物是：永不受婚配，长年在山林中与野兽为伴。
    refs: [homeric-hymns]
    at: { homeric-hymns: "5" }
  - text: 猎人阿克泰翁在林中撞见她沐浴。她掬水泼去，把他变成一头鹿；他自己的猎犬认不出主人，把他撕碎。
    refs: [library]
    at: { library: "3" }
  - text: 尼俄柏夸口子女比勒托多，阿提密斯与阿波罗以箭尽杀之。伊利亚特里，尼俄柏的结局被当作「凡人不要与神比」的范例讲给阿基里斯听。
    refs: [iliad]
    at: { iliad: "24" }
  - text: 特洛伊战争中她也站在特洛伊一边。第二十一卷她与赫拉当面对骂，被赫拉夺过弓来击打，又被掴了耳光，哭着回奥林帕斯，坐在父亲膝上诉苦。
    refs: [iliad]
    at: { iliad: "21" }
variants:
  - claim: 阿克泰翁之死，《书库》只说他被变成鹿、被猎犬撕碎；奥维德《变形记》把心理写得极细，还添了「她泼水时说的那句话」。两本相差数百年，情节骨架一致，动机与语气全是后加的。
    refs: [library, metamorphoses]
    at: { library: "3", metamorphoses: "3" }
relations:
  - { target: zeus, kind: 亲缘, detail: 父女，母为勒托, refs: [theogony] }
  - { target: apollo, kind: 亲缘, detail: 双生姐弟，她先出世并助其降生, refs: [theogony] }
  - { target: hera, kind: 敌对, detail: 生母被其追迫；战场上又正面冲突, refs: [iliad] }
  - { target: dodekatheon, kind: 从属, detail: 十二主神之一，掌狩猎, refs: [homeric-hymns] }
kinship:
  - relation: 母
    name: 勒托
    name_original: "Λητώ"
    note: 与阿波罗同母。分娩之地得洛斯因此成为她的圣地之一。
    refs: [homeric-hymns]
weapons:
  - name: 金弓
    name_original: "τόξον"
    note: 与阿波罗同源的远射之弓。她的箭多用于猎杀，也用于处死冒犯者。
    refs: [iliad]
    at: { iliad: "21" }

adaptations:
  - work: "《哈迪斯》与《哈迪斯 II》（Supergiant Games，2020／2025）"
    refs: [hades-game, hades-game-2]
    kind: 游戏
    portrayal: "祝福是暴击——她给的东西，出手就带着致命的一下。"
    divergences:
      - "原典里她是山林中的狩猎女神，与阿波罗是双生；游戏里她自称不爱与别的神打交道，说话比谁都直。"
      - "原典里她护着贞洁、罚过窥视她的人；游戏把这一层收掉了，只留下猎手与准头。"
