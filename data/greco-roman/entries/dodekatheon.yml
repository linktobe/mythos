legacy:
  - "两种通行的排法：其一为宙斯、赫拉、波塞冬、得墨忒耳、雅典娜、阿波罗、阿尔忒弥斯、阿瑞斯、阿佛洛狄忒、赫淮斯托斯、赫尔墨斯、赫斯提亚；其二把末一位换成狄俄尼索斯。前者较古，后者在雅典一带更常见。"
  - "本编两神并存。名单差异写在两位词条里，不合并、不标注谁更「正确」——原典没有给出过名单，也就没有标准答案可标。"
