id: dodekatheon
pantheon: greco-roman
entity_type: 群体
name: 奥林匹斯十二主神
name_original: "Δωδεκάθεον"
aliases: [十二神, 奥林匹斯众神]
summary: 以宙斯为首的十二位主神。数目固定，名单不固定：第十二位在赫斯提亚与狄俄尼索斯之间摆动，各时代给出的答案并不一致。
role:
  title: "「十二」是祭祀上的合称，不是家谱上的定数"
  brief: "这个数目属于祭坛与节庆，不属于谱系。原典里找不到一份「十二主神名单」；本编把两种排法都收，不代读者取舍，也不把哪一位当成冒名。"
identity:
  lineage:
    - { id: olympian }
  camp:
    - { id: olympus }
  realm:
    - { id: olympus }
narrative:
  - text: 克罗诺斯与瑞亚所生六子——赫斯提亚、得墨忒耳、赫拉、哈得斯、波塞冬、宙斯——先被父亲吞进腹中，宙斯长大后设法救出兄姐，六人成为新的掌权者。奥林匹斯这一支的班底，就是这六人加上他们在山上所生的子女。
    refs: [theogony]
    at: { theogony: "453–491" }
  - text: 战败提坦之后，三兄弟拈阄分治：宙斯得天空，波塞冬得海，哈得斯得冥界；大地与奥林匹斯山为三方共有。此后诸神各有职司与荣衔，山上的席位按出身与功劳排定。
    refs: [theogony, iliad]
    at: { theogony: "881–885", iliad: "15" }
  - text: 他们住在奥林匹斯山上，聚而议事、分席而食。人间有战事，他们各助一方，公开辩论，也公开结怨；宙斯的意志最大，但连他也常被赫拉绕过去。
    refs: [iliad]
    at: { iliad: "1" }
variants:
  - claim: 《神谱》把宙斯一房的家谱一路排到凡人，却始终没有「十二主神」这个说法；后世的谱系手册如《书库》按家谱整理诸神，也没有给出过一份固定名单。数目与席位是祭祀层面的事，不在谱系文本之内。
    refs: [library]
    at: { library: "3" }
