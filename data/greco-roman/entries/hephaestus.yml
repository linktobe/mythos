id: hephaestus
pantheon: greco-roman
entity_type: 神祇
name: 赫菲斯托斯
name_original: "Ἥφαιστος"
aliases: [跛足的神匠, 赫淮斯托斯]
counterpart:
  name: 武尔坎努斯
  name_original: Vulcanus
summary: 众神的匠人，锻铸之神。生来跛足，被母亲（一说父亲）抛下奥林帕斯；他用手艺赢回席位，也用一张看不见的网把妻子与阿瑞斯罩在床上。
role:
  title: "被扔下去的那个，最后给众神造了宫殿"
  brief: "他的权柄全在手上：神盾、权杖、自动的黄金侍女、会自己走的三脚架。身体是残的，做出来的东西却是同族里唯一不会坏的。"
identity:
  lineage:
    - { id: olympian }
  camp:
    - { id: olympus }
  realm:
    - { id: olympus }
narrative:
  - text: 关于他的母亲有两种说法。《书库》说赫拉见宙斯独自生出雅典娜，便也独自生下他；伊利亚特则把他写作宙斯与赫拉之子。
    refs: [library, iliad]
    at: { library: "1", iliad: "14" }
  - text: 他生来跛足，被抛下奥林帕斯。伊利亚特自身也有两种记忆：第十八卷说母亲赫拉因他残废而羞，把他扔下；第一卷他自己说，是宙斯抓住他的脚从门槛上摔下去的。两次都是忒提斯接住。
    refs: [iliad]
    at: { iliad: "1、18" }
  - text: 他在利姆诺斯与海底的洞中长大，学成锻铸。第十八卷为阿基里斯铸盾：五层盾面，日月星辰、两座城、耕作与收成、舞会与战争，全在方寸之间。他又造出黄金侍女扶持自己行走，造出能自己走进会场再走回来的三脚架。
    refs: [iliad]
    at: { iliad: "18" }
  - text: 妻子阿芙罗黛蒂与阿瑞斯私通。他在床顶悬了一张看不见的网，等二人躺下便收网，召众神来看。众神站在门口大笑，他却说：我跛，可我的手艺不跛。
    refs: [odyssey]
    at: { odyssey: "8" }
  - text: 神谱把他的妻子写作美惠三女神中最年轻的阿格莱亚。奥德赛却把他的妻子写作阿芙罗黛蒂——两处并存，后世读者多半只记得后者。
    refs: [theogony, odyssey]
    at: { theogony: "945–946", odyssey: "8" }
variants:
  - claim: 妻子两说：阿格莱亚（《神谱》）与阿芙罗黛蒂（《奥德赛》，捉奸故事所本）。本编两说并列，不替读者选一个更「正」的。
    refs: [theogony, odyssey]
    at: { theogony: "945–946", odyssey: "8" }
relations:
  - { target: hera, kind: 亲缘, detail: 母子；一说她独生，因他跛足而抛下奥林帕斯, refs: [iliad, library] }
  - { target: aphrodite, kind: 婚姻, detail: 妻，婚后不忠，以网捉之, refs: [odyssey] }
  - { target: ares, kind: 敌对, detail: 因其与阿芙罗黛蒂私通，被设网当众羞辱, refs: [odyssey] }
  - { target: zeus, kind: 亲缘, detail: 父子一说；另一说为赫拉独生, refs: [iliad, library] }
  - { target: dodekatheon, kind: 从属, detail: 十二主神之一，掌锻铸, refs: [theogony] }
kinship:
  - relation: 妻
    name: 阿格莱亚
    name_original: "Ἀγλαΐα"
    note: 美惠三女神之一。《神谱》所记之妻，与《奥德赛》的阿芙罗黛蒂并存。
    refs: [theogony]

adaptations:
  - work: "《哈迪斯 II》（Supergiant Games，2025）"
    refs: [hades-game-2]
    kind: 游戏
    portrayal: "续作才登场的一位，脾气大、说话直，祝福偏重爆发。"
    divergences:
      - "原典里他是众神的匠人，跛足而被母亲抛下；游戏里他只在对话里出现，连人都不露面。"
      - "原典里他在奥林帕斯与众神之间来回，替人铸器；游戏把他的作用压缩成一件借出去的东西。"
