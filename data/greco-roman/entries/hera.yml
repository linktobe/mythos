  - { target: poseidon, kind: 亲缘, detail: 姐弟, refs: [theogony] }
  - { target: demeter, kind: 亲缘, detail: 姐妹, refs: [theogony] }
  - { target: hestia, kind: 亲缘, detail: 姐妹, refs: [theogony] }
  - { target: ares, kind: 亲缘, detail: 母子, refs: [theogony] }
  - { target: hephaestus, kind: 亲缘, detail: 母子，独生一说，因他跛足而抛下奥林帕斯, refs: [iliad, library] }
  - { target: athena, kind: 敌对, detail: 因她生于宙斯之头而结怨，特洛伊战争中长期对立, refs: [iliad] }
  - { target: artemis, kind: 敌对, detail: 战场口角中夺其弓、掴其耳, refs: [iliad] }
  - { target: aphrodite, kind: 敌对, detail: 特洛伊战争中分属两方, refs: [iliad] }
  - { target: apollo, kind: 敌对, detail: 特洛伊战争中分属两方, refs: [iliad] }
  - { target: dodekatheon, kind: 从属, detail: 十二主神之一，宙斯之妻, refs: [theogony] }
