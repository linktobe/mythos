adaptations:
  - work: "《哈迪斯 II》（Supergiant Games，2025）"
    refs: [hades-game-2]
    kind: 游戏
    portrayal: "续作才登场的一位，说话端着天后的架子；祝福是「牵连」——被打中的敌人与同伙连成一片，伤一个，别的一起疼。"
    divergences:
      - "原典里她的权能落在婚姻与分娩，出手多半在家里与人间；游戏里她把力量只借到战场上。"
      - "原典里她以嫉妒与追罚宙斯的情人著称；游戏里这一层没有出现，她出场时只谈战局。"
