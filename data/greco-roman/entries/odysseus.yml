id: odysseus
pantheon: greco-roman
entity_type: 英雄
name: 奥德修斯
name_original: "Ὀδυσσεύς"
aliases: [拉厄耳忒斯之子, 多谋者]
counterpart:
  name: 尤利西斯
  name_original: Ulixes
summary: 伊塔卡王，特洛伊战争中的谋士，木马之计的提出者。战后在海上漂了十年，同伴尽失，独自回乡，用一张弓杀尽占他家宅的求婚者。
role:
  title: "会说话的人，最后靠一张弓说话"
  brief: "他的本事不是力气，是编故事、忍辱、算准时机。十年漂泊里他扮过乞丐、报过假名、哭过也骗过；真正解决问题的那一晚，他一句废话都没说。"
identity:
  lineage:
    - { id: mortal }
  camp:
    - { id: mortal }
  realm:
    - { id: earth }
narrative:
  - text: 他是伊塔卡王拉厄耳忒斯与安提克勒亚之子，外祖父奥托吕科斯是荷米斯之子、以善盗闻名。少年时他随外祖父上山打猎，被野猪在腿上撕开一道口子——多年后，老乳母为他洗脚，就是凭这道疤认出了乞丐模样的他。
    refs: [odyssey]
    at: { odyssey: "19" }
  - text: 伊利亚特里，他带十二条船参战，是联军中最会说话的一个。第二卷军心溃散时，他夺过权杖逐个拦回；第九卷与埃阿斯、福尼克斯出使阿基里斯，把利害一条条摆清；第十卷夜里潜入特洛伊营地探路。力气不如阿基里斯，主意多半出于他。
    refs: [iliad]
    at: { iliad: "2、9、10" }
  - text: 特洛伊久攻不下，是他提出木马之计：藏兵于巨木马腹中，余军佯退。特洛伊人把马拉进城，夜里伏兵开城门，城破。奥德赛里，歌手得摩多科斯在费埃克斯人的席上唱这一段，他听到自己的计策被唱出来，以衣遮面落泪。
    refs: [odyssey]
    at: { odyssey: "8" }
  - text: 归途先是逆风。他刺瞎了波赛顿之子、独眼巨人波利菲莫斯，从此被海神追着罚；在喀耳刻的岛上住了一年，又下到冥界问先知忒瑞西阿斯归期；过塞壬的海域时把自己绑在桅杆上，让同伴塞住耳朵；在斯库拉与卡律布狄斯之间失了六个同伴。
    refs: [odyssey]
    at: { odyssey: "9、10、11、12" }
  - text: 他在卡吕普索的岛上被留了七年，日日坐在海边哭。宙斯派荷米斯传令放人，他扎了只木筏出海，又被波赛顿一浪打碎，抱着一块木头漂到费埃克斯人的海岸。
    refs: [odyssey]
    at: { odyssey: "5、7" }
  - text: 回到伊塔卡时，他先扮作乞丐，试探妻子、儿子与家中的仆人。射箭比赛那天，只有他拉得开那张旧弓；一箭过后，他把求婚者一个个射死在厅堂里，最后与佩涅洛佩相认，靠的是一张只有二人知道的床。
    refs: [odyssey]
    at: { odyssey: "21、22、23" }
spotlight:
  title: 《奥德赛》
  text: 他的故事只有这一部是从头到尾属于他的。《伊利亚特》二十四卷里，他是联军中的一个谋士；《奥德赛》二十四卷里，首四卷写的是他不在场的家，其余全是他的归程——第九至十二卷由他本人在费埃克斯人的席上口述，连谎言与真话都是他自己排的次序。
  refs: [odyssey]
variants:
  - claim: 荷马写他最后还要再出门一次：先知忒瑞西阿斯说，他须扛着船桨走到一个不认得海的内陆，才能终老。奥德赛止于相认，没有再写这一段；后来的传说各续各的。
    refs: [odyssey]
    at: { odyssey: "11、23" }
relations:
  - { target: poseidon, kind: 敌对, detail: 其子波利菲莫斯被刺瞎，海神罚其十年不得归, refs: [odyssey] }
  - { target: athena, kind: 从属, detail: 受其庇护，漂泊与归乡中屡加照看, refs: [odyssey] }
  - { target: hermes, kind: 从属, detail: 受宙斯之命传令，并授其破解咒术的草, refs: [odyssey] }
  - { target: zeus, kind: 敌对, detail: 因其同伴宰食海利欧斯之牛，罚其不得归乡, refs: [odyssey] }
kinship:
  - relation: 父
    name: 拉厄耳忒斯
    name_original: "Λαέρτης"
    note: 伊塔卡老王。儿子归来时他正在果园里劳作，认亲靠的是儿时的暗号与腿上的伤疤。
    refs: [odyssey]
  - relation: 母
    name: 安提克勒亚
    name_original: "Ἀντίκλεια"
    note: 奥托吕科斯之女。因思念儿子而死；奥德修斯在冥界见到她的魂灵，三次伸手都抱不住。
    refs: [odyssey]
  - relation: 妻
    name: 佩涅洛佩
    name_original: "Πηνελόπη"
    note: 苦守二十年，以织了又拆的布匹拖延求婚者。最终以搬床一试认出丈夫。
    refs: [odyssey]
  - relation: 子
    name: 忒勒马科斯
    name_original: "Τηλέμαχος"
    note: 父亲出征时还是婴儿。成年后出海寻父，归来与父亲一同清剿求婚者。
    refs: [odyssey]
legacy:
  - "但丁把他放在《神曲·地狱篇》第二十六歌的火舌里，让他为求知再出一次海并葬身其中；这一笔与原典的「终老于内陆」完全相反。"
  - "二十世纪，乔伊斯把《尤利西斯》的十八个章节一一钉在《奥德赛》的卷次上——书名如此，情节却只发生在都柏林的十八个小时里。"

adaptations:
  - work: "《刺客信条：奥德赛》（Ubisoft，2018）"
    refs: [ac-odyssey]
    kind: 游戏
    portrayal: "游戏借《奥德赛》之名，舞台却不在特洛伊战后，而在公元前 431 年的伯罗奔尼撒战争；主角是虚构的佣兵卡珊德拉或阿利克西欧斯。"
    divergences:
      - "原典的奥德修斯是伊塔刻之王；游戏里他不出场，主角是列奥尼达的后裔，与荷马的人物没有关系。"
      - "原典的特洛伊战争落在神话年代；游戏把它挪到有史可考的伯罗奔尼撒战争，两者相隔约七百年。"
      - "原典里诸神亲自介入人事；游戏把神写成「伊述」，即被后人误认作神的史前文明成员。"
