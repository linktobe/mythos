  - { target: hera, kind: 从属, detail: 被父亲吞下，后获救参战, refs: [theogony] }
  - { target: demeter, kind: 从属, detail: 同上, refs: [theogony] }
  - { target: hestia, kind: 从属, detail: 同上, refs: [theogony] }
legacy:
  - 后世把这个词用成一类冲突的通名：凡是新旧两代神争夺统治权，都可以叫某某的泰坦之战。
