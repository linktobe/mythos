id: underworld
pantheon: greco-roman
entity_type: 地区
name: 冥界
name_original: "Ἅιδου δόμοι"
aliases: [冥府, 地府, 黄泉, 黑帝斯之宅]
summary: 凡人死后所往之处。渡过去就没有回程：一条河、一头守门的犬、一位持金杖的判官，以及那些被留下受罚的人。黑帝斯与波瑟芬妮居其深处。
role:
  title: "所有人的去处"
  brief: "它不是刑罚，是归宿。荷马写到冥界时最动人的一句不是恐吓，而是阿基里斯的实话——宁可在人间给人当雇工，也不愿在这里做王。"
identity:
  lineage:
    - { id: olympian, note: 治者出自这一族；界中的判官与亡魂不在这个血统之内 }
  camp:
    - { id: underworld }
  realm:
    - { id: underworld }
narrative:
  - text: 荷马把它放在大地尽头、俄刻阿诺斯的彼岸。那里住着辛梅里亚人，终年笼罩在雾与黑暗里，太阳升落都照不进去；活人要走到那儿，先得渡过大洋。
    refs: [odyssey]
    at: { odyssey: "11" }
  - text: 冥界的入口是一片汇流：皮里佛勒革同与科库托斯（斯堤克斯的支流）在这里流入阿刻戎，两条河在一片岩石旁合成一条。
    refs: [odyssey]
    at: { odyssey: "10" }
  - text: 门前守着克尔柏洛斯。神谱说它是艾奇德娜与堤丰所生，「吃生肉、青铜之声、五十个头」，狠而不肯让路。
    refs: [theogony]
    at: { theogony: "306–332" }
  - text: 界中有斯堤克斯。众神起了争执、或有人说了假话，宙斯就遣伊丽丝去，用金壶取回那水，让说谎者对着它立誓——这是众神最重的一条誓。
    refs: [theogony]
    at: { theogony: "775–806" }
  - text: 进来的多是影子。奥德修斯见到的母亲没有血肉，抱不住；阿基里斯说的话更直白：宁可在人间给穷人当雇工，也不愿在这里做众王之王。
    refs: [odyssey]
    at: { odyssey: "11" }
  - text: 断案的是米诺斯，持金杖坐在当中，亡魂环着他听判。受罚的是少数：提堤俄斯躺满九亩地、两只秃鹫啄他的肝；坦塔洛斯站在齐颈的水里喝不到水；薛西弗斯推石上山，到顶就滚下来。
    refs: [odyssey]
    at: { odyssey: "11" }
  - text: 它与塔尔塔罗斯不是一处。赫西俄德说，青铜砧从天上落九昼夜才到地，再落九昼夜才到塔尔塔罗斯；荷马说得更省：那地方在天之下，正如天在地上之高。
    refs: [theogony, iliad]
    at: { theogony: "713–735", iliad: "8" }
variants:
  - claim: 冥界的方位各本不一：荷马把它放在大地尽头、日光照不到的海岸，活人要渡过大洋才到；赫西俄德把囚禁泰坦的塔尔塔罗斯放在大地极深处，与冥界各是一处。本编两说并存，不合成一地。
    refs: [odyssey, theogony]
    at: { odyssey: "11", theogony: "713–735" }
relations:
  - { target: hades, kind: 从属, detail: 治者，拈阄分得此处, refs: [theogony] }
  - { target: persephone, kind: 从属, detail: 治者，冥后, refs: [homeric-hymns] }
legacy:
  - "中文旧译作「黄泉」「地府」，取的是「有去无回」这一层意思；本编作「冥界」，与塔尔塔罗斯分开记，不合成一处。"
  - "摆渡人卡戎不在本编所据的原典里：荷马与赫西俄德写到冥界时都没有这一号人物，亡魂渡河的说法要到更晚的记述才成形。"
  - "罗马的冥界另有一套写法，维吉尔《埃涅阿斯纪》第六卷写得最全；那属于 T2，本编只在异文与后世演绎里提及。"

adaptations:
  - work: "《哈迪斯》（Supergiant Games，2020）"
    refs: [hades-game]
    kind: 游戏
    portrayal: "冥界被做成三层向上的关卡：塔耳塔洛斯、水仙平原、至福乐土，尽头是斯堤克斯的神庙；每一层的亡魂各按生前分流。"
    divergences:
      - "原典的冥界没有分层审判这回事：荷马笔下众魂同处一片昏冥，受罚的只有点名的几个；游戏把它做成三层，按生平分流。"
      - "原典里活人下去要献祭通灵——奥德修斯挖沟、以血引魂；游戏里活人是一路打上去的。"
  - work: "《刺客信条：奥德赛》附加内容《亚特兰蒂斯的命运》第二幕《黑帝斯的折磨》（Ubisoft，2019）"
    refs: [ac-odyssey]
    kind: 游戏
    portrayal: "冥界是一整片可游玩的地界，黑帝斯在此设下囚牢与审判，玩家在里边与亡魂、与神打交道。"
    divergences:
      - "原典的冥界是所有人唯一的去处，没有「过完这一趟」这回事；游戏把它写成剧情里可以进出的一处地界。"
      - "原典里冥界与塔耳塔罗斯分处两地；游戏把囚牢与审判都收进同一张地图。"
