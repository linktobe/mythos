# 原典登记表
# tier: T0 = 原典（荷马、赫西俄德等古风期作品）；T1 = 古代汇编／系统整理
#       T2 = 后世重述（罗马人的改写）。
# 规则：叙事主干只引用 T0/T1；T2/T3 只能出现在 variants / legacy / adaptations。
# 引文一律「原文 + 自译」，不抄现代中译本。url 指向公有领域原文库，供读者核对。
#
# unit：该部典籍的计节单位。荷马按「卷」，赫西俄德按「行」，颂歌按「篇」。

- id: theogony
  pantheon: greco-roman
  tier: T0
  title: 神谱
  original: Θεογονία
  work: 赫西俄德
  work_original: Hesiod, Theogony
  date: 约公元前 700 年
  lang: 古希腊语
  unit: 行
  url: https://sacred-texts.com/book/the-theogony-of-hesiod/the-theogony-of-hesiod
  note: 全诗 1022 行。诸神谱系与奥林帕斯掌权的由来，以本书为最早的系统叙述；引文按行号。

- id: works-days
  pantheon: greco-roman
  tier: T0
  title: 工作与时日
  original: Ἔργα καὶ Ἡμέραι
  work: 赫西俄德
  work_original: Hesiod, Works and Days
  date: 约公元前 700 年
  lang: 古希腊语
  unit: 行
  url: https://sacred-texts.com/book/works-and-days/hesiod-works-and-days
  note: 普罗米修斯盗火、潘多拉与人类五个时代的完整叙述在此，《神谱》只一句带过。

- id: iliad
  pantheon: greco-roman
  tier: T0
  title: 伊利亚特
  original: Ἰλιάς
  work: 荷马
  work_original: Homer, Iliad
  date: 约公元前 8 世纪
  lang: 古希腊语
  unit: 卷
  url: https://sacred-texts.com/book/the-iliad-of-homer
  note: 二十四卷。特洛伊战争第十年的五十一天。神界政治写得最细，诸神各助一方，互相拆台。

- id: odyssey
  pantheon: greco-roman
  tier: T0
  title: 奥德赛
  original: Ὀδύσσεια
  work: 荷马
  work_original: Homer, Odyssey
  date: 约公元前 8 世纪
  lang: 古希腊语
  unit: 卷
  url: https://sacred-texts.com/book/the-odyssey-of-homer
  note: 二十四卷。奥德修斯自特洛伊归乡的十年。第九至十二卷由他本人在费埃克斯人的席上口述。

- id: homeric-hymns
  pantheon: greco-roman
  tier: T0
  title: 荷马颂歌
  original: Ὁμηρικοὶ ὕμνοι
  work: 荷马颂歌集
  work_original: Homeric Hymns
  date: 约公元前 7–前 5 世纪
  lang: 古希腊语
  unit: 篇
  url: https://sacred-texts.com/book/the-homeric-hymns
  note: 三十三篇长短不一的六音步颂歌。狄蜜特、阿波罗、荷米斯、阿芙罗黛蒂、狄奥尼索斯各有长篇专颂，是这几位神最早的完整叙事。

- id: library
  pantheon: greco-roman
  tier: T1
  title: 书库
  original: Βιβλιοθήκη
  work: 阿波罗多洛斯
  work_original: Pseudo-Apollodorus, Bibliotheca
  date: 约公元前 1 世纪–公元 2 世纪
  lang: 古希腊语
  unit: 卷
  url: https://www.theoi.com/Text/Apollodorus1.html
  note: 三卷加摘要，按谱系把散在各处的神话串成连续叙述。不少故事只剩它一个完整版本；作者托名阿波罗多洛斯，今人只称「托名阿波罗多洛斯」。

- id: library-epitome
  pantheon: greco-roman
  tier: T1
  title: 书库·摘要
  original: Ἐπιτομή
  work: 阿波罗多洛斯
  work_original: Pseudo-Apollodorus, Epitome
  date: 约公元前 1 世纪–公元 2 世纪
  lang: 古希腊语
  unit: 卷
  url: https://www.theoi.com/Text/ApollodorusE.html
  note: 随《书库》一同传下的节要，从忒修斯一路讲到特洛伊战后归乡，另含赫拉克勒斯诸差事的补记。原书三卷在此不重出，故单列一目，按摘要自身的卷次引用。

- id: xenophon
  pantheon: greco-roman
  tier: T1
  title: 回忆苏格拉底
  original: Ἀπομνημονεύματα
  work: 色诺芬
  work_original: Xenophon, Memorabilia
  date: 约公元前 4 世纪
  lang: 古希腊语
  unit: 卷
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0207:book=2:chapter=1
  note: 苏格拉底言行录。第二卷末记普罗狄科斯所讲「海克力斯的选择」，是这一典故今存最早的完整出处。

- id: pausanias
  pantheon: greco-roman
  tier: T1
  title: 希腊道里志
  original: Ἑλλάδος Περιήγησις
  work: 保萨尼亚斯
  work_original: Pausanias, Description of Greece
  date: 约公元 2 世纪
  lang: 古希腊语
  unit: 卷
  url: https://www.theoi.com/Text/Pausanias1A.html
  note: 十卷游记，逐地记神庙、祭仪与当地异传。凡与史诗不合处，多由它保存下来。

- id: metamorphoses
  pantheon: greco-roman
  tier: T2
  title: 变形记
  original: Metamorphōsēs
  work: 奥维德
  work_original: Ovid, Metamorphoses
  date: 公元 8 年
  lang: 拉丁语
  unit: 卷
  url: https://www.theoi.com/Text/OvidMetamorphoses1.html
  note: 罗马人重述希腊神话，十五卷、约二百五十个变形故事。文笔最盛，离原典也最远；本编只用于异文与后世演绎。

# ── T3 现代改编：只进「改编形象对照」，不进叙事 ──────────────

- id: hades-game
  pantheon: greco-roman
  tier: T3
  title: 哈迪斯
  original: Hades
  work: 电子游戏
  work_original: Hades, Supergiant Games
  date: 2020 年
  author: Supergiant Games
  lang: 英语
  unit: ''
  note: 以冥界为舞台的地牢游戏。主角扎格柔斯在俄耳甫斯教的残篇里只有一个名字，这里被写成想逃出冥界的儿子；冥神一家按现代家庭剧重排。

- id: hades-game-2
  pantheon: greco-roman
  tier: T3
  title: 哈迪斯 II
  original: Hades II
  work: 电子游戏
  work_original: Hades II, Supergiant Games
  date: 2024 年（抢先体验）／2025 年（正式版）
  author: Supergiant Games
  lang: 英语
  unit: ''
  note: 前作的续篇。主角换成墨利诺厄——这个名字在原典里只出现过一两次；对手是逃出塔耳塔罗斯的时间之神克洛诺斯。

- id: ac-odyssey
  pantheon: greco-roman
  tier: T3
  title: 刺客信条：奥德赛
  original: Assassin's Creed Odyssey
  work: 电子游戏
  work_original: Assassin's Creed Odyssey, Ubisoft
  date: 2018 年（附加内容《亚特兰蒂斯的命运》2019 年）
  author: Ubisoft Quebec
  lang: 英语
  unit: ''
  note: 以公元前 431 年的伯罗奔尼撒战争为舞台。附加内容把极乐境、冥界与亚特兰蒂斯写成三处可游玩的地界，诸神在其中出场。
