kinship:
  - relation: 子
    name: 天之忍穗耳命
    name_original: "アメノオシホミミ"
    note: 天照最初命他下治苇原中国，他登天浮桥见国土喧扰而返，改由其子天孙降临。
    refs: [kojiki]
legacy:
  - "伊势神宫内宫以她为祭神，所奉神体即八咫镜；日本皇室的始祖神叙事以她为顶点。"
adaptations:
  - work: "《大神》（2006）"
    refs: [okami]
    kind: 游戏
    portrayal: "天照被写成一头白狼，背负「天笔」在苇原中国行走，一路净化被妖气侵蚀的土地。"
    divergences:
      - "原典的天照始终居于高天原，几乎不亲自下到苇原中国；游戏让「她」作为旅行者走遍全国。"
      - "原典以镜、勾玉、剑三神器为皇权之证；游戏把「笔」这一绘画道具抬到核心，与三神器并无对应关系。"
      - "原典的天照是日神兼皇祖，游戏只保留日神的一面，且以动物形态出现。"
