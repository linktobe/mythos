id: inaba-hare
pantheon: japanese
entity_type: 事件
name: 因幡白兔
name_original: "イナバノシロウサギ"
aliases: [稻羽之素兔, 兔神]
summary: 一只被鳄鱼剥皮的兔子，在因幡的气多岬被八十神所骗，又得大国主救治；它预言大国主终将娶得八上比卖。
role:
  title: "一次以德报怨的救治"
  brief: "整件事里没有神迹，只有一条处置伤口的正确办法：先用淡水洗，再滚蒲黄。做对的事的人是弟弟，不是兄长——这是《古事记》给大国主的第一笔人望。"
identity: {}
narrative:
  - text: 兔子原住隐岐岛，欲渡海来此，便骗海中鳄鱼说要比一比族数多寡，让它们从岛到气多岬排成一列，自己踏着数过去。上岸前它说破了骗局，被排在最后的一条鳄鱼擒住，剥去了全身皮毛。
    refs: [kojiki]
    at: { kojiki: "21" }
  - text: 走在前的八十神教它去浸海水、临风而卧；海水一干，皮肉尽裂，痛得哭泣。
    refs: [kojiki]
    at: { kojiki: "21" }
  - text: 落在最后的大国主见了，问明缘由，教它先到河口用淡水洗净身体，再取河口的蒲黄铺开、滚在上面。兔子照做，皮毛复原如初。
    refs: [kojiki]
    at: { kojiki: "21" }
  - text: 兔子遂对大国主说：八十神必不能得八上比卖，虽背囊者亦必得之。记纪说它后来被称为「兔神」，受祀至今。
    refs: [kojiki]
    at: { kojiki: "21" }
variants:
  - claim: 此事仅见《古事记》，《日本书纪》神代卷不载。它是《古事记》独有的名篇，也是「因幡白兔」一说的唯一出处。
    refs: [kojiki, nihonshoki]
legacy:
  - "白兔神社（鸟取市）以它为祭神，社传把「蒲黄」一节与当地海滨地名相系；故事也是日本最早的「动物报恩」型叙事之一。"
