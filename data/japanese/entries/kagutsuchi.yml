id: kagutsuchi
pantheon: japanese
entity_type: 神祇
name: 迦具土神
name_original: "カグツチノカミ"
aliases: [火之夜艺速男神, 火之炫毗古神]
summary: 火神。出生时灼死其母，随即被其父斩首；刀上之血与尸体各化生八神。
role:
  title: "一出生就带来死亡的火"
  brief: "他没有做过任何事，存在的全部意义就是「造成死亡」——母亲的死，以及随后由血与尸化生出的十六柱神。"
identity:
  lineage:
    - { id: kamiumi }
  camp:
    - { id: chuu }
  realm:
    - { id: beyond, note: 生而被斩，未及有所居 }
narrative:
  - text: 伊邪那美生他时被灼，不久神避。他是记纪中第一团火，也是第一个死因。
    refs: [kojiki]
    at: { kojiki: "6–7" }
  - text: 伊邪那岐以十拳剑斩其首。剑锋之血溅于石上，生石拆神、根拆神、石筒之男神；剑身之血生威速神、火速神、建御雷之男神；剑柄之血自指间漏出，生暗淤加美神、暗御津羽神。以上八神皆自剑生。
    refs: [kojiki]
    at: { kojiki: "8" }
  - text: 其尸身化为八柱山津见神：头为正鹿山津见，胸为淤縢山津见，腹为奥山津见，阴为暗山津见，左手为志艺山津见，右手为羽山津见，左足为原山津见，右足为户山津见。
    refs: [kojiki]
    at: { kojiki: "8" }
  - text: 斩他所用的剑，本名天之尾羽张，又名伊都之尾羽张。血中而生的建御雷之男神，后来正是让国交涉时迫降建御名方神的那一位——火神之死，间接长出了征服出云的力量。
    refs: [kojiki]
    at: { kojiki: "8" }
variants:
  - claim: 《日本书纪》卷一作「轲遇突智」，斩之者为伊奘诺尊，用剑作「十握剑」；所化生诸神的名目与《古事记》多有出入，且另列一书记其尸化山神之说。
    refs: [nihonshoki]
    at: { nihonshoki: "卷一" }
legacy:
  - "后世神社中另有以「火产灵」神号奉祀火神者，与迦具土常被视作同一种格的不同名号。"
