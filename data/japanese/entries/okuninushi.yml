  - { target: ashihara, kind: 从属, detail: 开拓此土、又让于此, refs: [kojiki] }
kinship:
  - relation: 父
    name: 天之冬衣神
    name_original: "アメノフユキヌ"
    note: 六世谱中的第五代。
    refs: [kojiki]
  - relation: 母
    name: 刺国若比卖
    name_original: "サシクニワカヒメ"
    note: 刺国大神之女。他两次被害，皆由母亲求神救治。
    refs: [kojiki]
  - relation: 子
    name: 事代主神
    name_original: "コトシロヌシノカミ"
    note: 母为神屋楯比卖。让国时率先应允。
    refs: [kojiki]
  - relation: 子
    name: 味耜高彦根神
    name_original: "アジスキタカヒコネ"
    note: 母为宗像的多纪理毗卖，后世称贺茂之大御神。
    refs: [kojiki]
  - relation: 子
    name: 木俣神
    name_original: "キノマタノカミ"
    note: 母为八上比卖；因惧嫡妻，生下后弃于树杈间。
    refs: [kojiki]
legacy:
  - "后世把他与佛教的大黑天混同，成为七福神之一「大黑天」：头戴大黑帽、肩扛米袋、手持槌。原典里并没有这些。"
