id: sarutahiko
pantheon: japanese
entity_type: 神祇
name: 猿田毗古神
name_original: "サルタヒコノカミ"
aliases: [猿田彦大神, 衢神]
summary: 天之八衢的国神，光华上照高天、下照苇原；自请为天孙先导，后于阿邪诃渔猎时被贝夹手而溺死。
role:
  title: "站在路口的那位"
  brief: "他只在两个场面里出现：挡住天孙的路，和淹死在海边。前者让他成了「引路之神」，后者让他的名字变成三个泡沫的名字。"
identity:
  lineage:
    - { id: kunitsu }
  camp:
    - { id: takama, note: 归顺天孙一方 }
  realm:
    - { id: ashihara, note: 阿邪诃与伊势 }
narrative:
  - text: 天孙将降之时，他立于天之八衢，身长而光华上照高天原、下照苇原中国。天照命天宇受卖命前往查问，其自称「国神猿田毗古」，因闻天孙将降，特来迎候、愿为先导。
    refs: [kojiki]
    at: { kojiki: "33" }
  - text: 天孙命天宇受卖命护送他回去，并令她承袭其名以奉侍；后世猿女君一族自称其名号，即由此而来。
    refs: [kojiki]
    at: { kojiki: "35" }
  - text: 他在阿邪诃一带渔猎，手被一枚平贝夹住，溺于海水。记纪按他下沉的三个阶段各记一名：沉至底时、海水涌起时、气泡破裂时，名号各别，皆以「灵」称之。
    refs: [kojiki]
    at: { kojiki: "36" }
  - text: 天宇受卖命归来之后，聚海中大小鱼类问「你们可愿奉侍天神之子」，众鱼皆应，唯海鼠（海参）不答，她遂以小刀割其口——今日海参之口裂，即由此故。
    refs: [kojiki]
    at: { kojiki: "36" }
variants:
  - claim: 《古事记》只记他被贝夹手而溺；后世神社传说另有一说，谓他指引天孙之后隐居伊势，与天宇受卖命结为夫妇，是猿女与猿田彦两族共同的祖神。原典无此情节。
    refs: [kojiki]
legacy:
  - "作为「引路之神」「道祖神」受祀，伊势猿田彦神社、东京的猿田彦神社皆奉他；「道祖神」信仰多以此神为主。"
