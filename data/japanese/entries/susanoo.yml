id: susanoo
pantheon: japanese
entity_type: 神祇
name: 建速须佐之男命
name_original: "タケハヤスサノオノミコト"
aliases: [素戔嗚尊, 须佐之男, 牛头天王]
summary: 三贵子之一，受命治海原而不治，被逐出高天原，降至出云斩八岐大蛇，成为国津神一系的始祖。
role:
  title: "被赶出来的海神"
  brief: "他被分到海，却哭着不肯去；被父亲赶走，又跑到姐姐那里闹；最后在出云落地，成了另一支神系的祖宗。三贵子里只有他走了第三条路。"
identity:
  lineage:
    - { id: amatsu }
  camp:
    - { id: izumo }
  realm:
    - { id: ashihara, note: 降于出云，建须贺宫 }
    - { id: ne, note: 所自称「亡母之国」，终未成行 }
narrative:
  - text: 伊邪那岐洗鼻而生，受命治理海原。他不治所命之国，日夜啼哭，说要去亡母所在的根之坚洲国，哭声使青山如枯野。伊邪那岐大怒，将他放逐。
    refs: [kojiki]
    at: { kojiki: "10–12" }
  - text: 他赴高天原求见天照。天照疑他有夺位之心，二人隔天安河立誓，各取对方之物生子：他嚼天照的八尺琼勾玉生五男神，五男神归天照；天照嚼他的十拳剑生三女神，三女神归他。
    refs: [kojiki]
    at: { kojiki: "13–14" }
  - text: 誓约之后他仍不收敛：毁田埂、填沟渠、于新殿之上便溺，又惊死织女。天照惧而入天石屋户，天地成夜。事后八百万神议其罪，罚偿千座台，剃其须、拔其手足之甲，将他逐出高天原。
    refs: [kojiki]
    at: { kojiki: "15–17" }
  - text: 被逐之后，他向大气津比卖神求食。她自口、鼻、尻取出食物奉上，他以为污秽，当场将她杀死。尸身生蚕、稻、粟、小豆、麦、大豆，神产巢日神取之为五谷之种。
    refs: [kojiki]
    at: { kojiki: "17" }
  - text: 降至出云肥河之上的鸟发地，遇足名椎、手名椎夫妇正为其女栉名田比卖哭泣。他问明大蛇形状，将少女化为梳插于发中，命老夫妇酿八盐折酒、围垣设八门、每门设八台、每台置酒槽。大蛇至，八头各就一槽饮之，醉卧；他以十拳剑斩之，肥河化为血河。
    refs: [kojiki]
    at: { kojiki: "18" }
  - text: 斩至中尾时剑刃缺，剖开尾肉，内中得一柄大刀。他把刀取下，献于天照。此后建须贺宫，咏「八云立，出云八重垣」之歌；娶栉名田比卖，生八岛士奴美神，出云一系自此开端。
    refs: [kojiki]
    at: { kojiki: "18–20" }
variants:
  - claim: 「天丛云剑」之名出自《日本书纪》；《古事记》称此剑为都牟刈之大刀，又名草那艺之大刀。今日通称的「草薙剑」是同一柄剑的第三种写法。
    refs: [kojiki, nihonshoki]
    at: { nihonshoki: "卷一" }
  - claim: 《日本书纪》卷一另列「一书曰」数种，记素戔嗚尊求婚、以酒醉蛇之事大同小异，但斩蛇之地与所得剑名互有出入。
    refs: [nihonshoki]
    at: { nihonshoki: "卷一" }
legacy:
  - "后世以「牛头天王」之名在祇园、八坂一带奉祀他，与佛教的祇园精舍传说合流，形象与原典的暴乱之神相去甚远。"
