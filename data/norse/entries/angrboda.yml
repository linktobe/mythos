id: angrboda
pantheon: norse
entity_type: 巨人
name: 安格尔波达
name_original: "Angrboða"
aliases: [带来痛苦者]
summary: 居于铁森林的女巨人，洛基的伴侣，芬里尔、耶梦加得与海拉之母。
role:
  title: "祸端的母体"
  brief: "诸神最忌惮的三头怪物出自她一人。她本人几乎没有单独的故事，却是整条灾厄线的起点。"
identity:
  lineage: [jotunn]
  camp:
    - { id: jotnar }
  realm:
    - { id: jotunheim, note: 铁森林 }
narrative:
  - text: "她是居于铁森林的女巨人。与洛基结合，生下芬里尔、耶梦加得与海拉三子。"
    refs: [gylfaginning]
  - text: "诸神探知这三子的来历与预言，分别处置：缚住巨狼，将巨蟒掷入海中，把海拉遣往冥界。"
    refs: [gylfaginning]
  - text: "《女巫的预言》写到铁森林中有一位老妇，在那里养育芬里尔一族；后世多以为此人即安格尔波达。"
    refs: [voluspa]
variants:
  - claim: "铁森林中的老妇是否即她，学界有不同看法；诗体埃达未点其名。"
    refs: [voluspa]
relations:
  - { target: loki, kind: 婚姻, detail: 伴侣, refs: [gylfaginning] }
  - { target: fenrir, kind: 亲缘, detail: 母子, refs: [gylfaginning] }
  - { target: jormungandr, kind: 亲缘, detail: 母子, refs: [gylfaginning] }
  - { target: hel, kind: 亲缘, detail: 母女, refs: [gylfaginning] }
legacy:
  - 漫威电影宇宙中，海拉被改写为奥丁之女，与她的子女线完全无关。
