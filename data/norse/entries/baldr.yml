id: baldr
pantheon: norse
entity_type: 神祇
name: 巴德尔
name_original: "Baldr"
aliases: [光明之神, 巴尔德]
summary: 奥丁与弗丽嘉之子，其死是诸神黄昏的起点。
role:
  title: "光明与美善的象征"
  brief: "其死是诸神黄昏的第一块骨牌；而他在新世界归来，则标志毁灭之后的重新开始。"
identity:
  lineage: [aesir]
  camp:
    - { id: aesir }
  realm:
    - { id: asgard, note: 布列达布利克 }
narrative:
  - text: 奥丁与弗丽嘉之子，光明之神。众神知其刀枪不入，遂以投掷兵器伤他为戏。
    refs: [gylfaginning, baldrs-draumar]
  - text: 洛基探知唯一能伤他的是槲寄生，于是诱盲神霍德尔将槲寄生枝投出，巴德尔当场身亡。
    refs: [gylfaginning]
  - text: 遗体被抬上船火葬。赫尔莫德赴冥界求还，海拉开出条件：万物皆为之哭泣方可归来，女巨人托克（洛基所化）拒绝哭泣，巴德尔遂留冥界。
    refs: [gylfaginning]
variants:
  - claim: 《巴德尔的梦》只写奥丁赴冥界问卜儿子之死，没有槲寄生、霍德尔等情节；该情节仅见于《欺骗古鲁菲》。
    refs: [baldrs-draumar, gylfaginning]
relations:
  - { target: odin, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: frigg, kind: 亲缘, detail: 母子, refs: [gylfaginning] }
  - { target: loki, kind: 敌对, detail: 被设计致死, refs: [gylfaginning] }
  - { target: hel, kind: 敌对, detail: 被拒绝归还, refs: [gylfaginning] }
legacy:
  - text: "《战神》（2018）将其改写为受诅咒的不死战士，与光明神形象无关。"
    refs: [god-of-war-2018]

adaptations:
  - work: "《战神》（2018）"
    refs: [god-of-war-2018]
    kind: 游戏
    portrayal: "受母亲咒护、刀枪不入也无法感受痛觉的复仇者，一路追杀父子二人。"
    divergences:
      - "原典的巴德尔可被槲寄生所伤；游戏以「无痛感」与特定武器替代，破防机制完全不同。"
      - "原典他的死由洛基诱使盲神霍德尔造成，是诸神黄昏的起点；游戏没有这一层因果。"
      - "游戏把他写成执念深重的敌人，原典中他是众神所爱、却死得毫无抵抗的光明之神。"
