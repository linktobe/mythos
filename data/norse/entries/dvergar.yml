id: dvergar
pantheon: norse
entity_type: 群体
name: 矮人
name_original: "Dvergar"
aliases: [侏儒, 黑暗精灵]
summary: 居于地下与石中的工匠族群，诸神的神器多出其手。
role:
  title: "神器的来源"
  brief: "诸神不自己造兵器。锤、枪、戒指、船、野猪，凡叫得出名字的宝物，几乎都出自矮人的炉火。他们既是供货方，也是赌局的对手。"
identity:
  lineage:
    - { id: dwarf }
  camp:
    - { id: aesir, note: 常为诸神造器 }
  realm:
    - { id: svartalfheim, note: 一说居于石中与地下 }
narrative:
  - text: "诸神以始祖巨人尤弥尔的身躯造世界时，蛆虫自其血肉中生出，受诸神赐予人形与理智，成为矮人。"
    refs: [gylfaginning]
  - text: "《女巫的预言》中有一段专列矮人名号，后世称为「矮人名录」，一口气念出数十个名字。"
    refs: [voluspa]
  - text: "他们居于石中与地下，以锻造著称：托尔的锤、奥丁的枪与戒指、弗雷的船与野猪，皆其手笔。"
    refs: [skaldskaparmal, gylfaginning]
variants:
  - claim: "矮人与「黑暗精灵」是否同族，原典用词并不统一：斯瓦塔尔法海姆之名兼指二者，学界至今未有定论。"
    refs: [gylfaginning]
relations:
  - { target: sindri, kind: 从属, detail: 族中工匠, refs: [skaldskaparmal] }
  - { target: brokkr, kind: 从属, detail: 族中工匠, refs: [skaldskaparmal] }
  - { target: mjolnir, kind: 从属, detail: 族中所铸, refs: [skaldskaparmal] }
legacy:
  - 现代奇幻里的「矮人」几乎全部承自此族：善矿、善锻、居于地下。
