id: freyr
pantheon: norse
entity_type: 神祇
name: 弗雷
name_original: "Freyr"
aliases: [弗蕾, 丰饶之神]
summary: 华纳神族，掌丰饶与和平，因失剑而死于诸神黄昏。
role:
  title: "和平与丰收的赐予者"
  brief: "掌管雨水、阳光与收成。因求娶巨人而失去宝剑，最终无兵可战——和平之神在末日的无力。"
identity:
  lineage: [vanir]
  camp:
    - { id: vanir, until: 两族议和 }
    - { id: aesir, from: 作为人质入阿斯加德 }
  realm:
    - { id: vanaheim, note: 出身 }
    - { id: asgard, note: 常居 }
narrative:
  - text: 尼约德之子、芙蕾雅之兄，华纳神族，掌丰饶、雨水与和平，随父入阿萨为质。
    refs: [gylfaginning]
  - text: 他有一柄能自行斩击的剑，后由侍从斯基尼尔携往求娶女巨人葛德；剑自此不复归他。
    refs: [skaldskaparmal]
  - text: 诸神黄昏时他因无剑在身，被火巨人苏尔特所杀。
    refs: [gylfaginning]
variants:
  - claim: 求娶葛德一事的主要叙述在《斯基尼尔之歌》（诗体埃达），《诗语》仅作典故征引。
    refs: [skaldskaparmal]
relations:
  - { target: njord, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: freyja, kind: 亲缘, detail: 兄妹, refs: [gylfaginning] }
legacy:
  - 瑞典古名有 "弗雷的领地" 之说，属后世推测。
weapons:
  - name: 弗雷之剑
    name_original: "Freyr's sword"
    note: "能自行斩击的宝剑。弗雷遣侍从斯基尼尔持此剑往求葛德，剑自此不归；末日他无兵可用，死于苏尔特尔之手。"
    refs: [skaldskaparmal, gylfaginning]
