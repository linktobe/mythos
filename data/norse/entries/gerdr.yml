id: gerdr
pantheon: norse
entity_type: 巨人
name: 葛德
name_original: "Gerðr"
aliases: [盖尔达]
summary: 女巨人，弗雷之妻；弗雷为求娶她而失去了自己的宝剑。
role:
  title: "换来宝剑的人"
  brief: "她是整条诸神黄昏因果链上的一个扣：弗雷为了娶她，把能自行斩击的剑交了出去。末日那天，他手里没有兵器。"
identity:
  lineage: [jotunn]
  camp:
    - { id: jotnar }
  realm:
    - { id: jotunheim }
narrative:
  - text: "她是约顿海姆的女巨人。弗雷坐于高座望见她的身影，一见倾心，遂派侍从斯基尼尔携剑前往求亲。"
    refs: [skaldskaparmal]
  - text: "葛德起初拒绝。斯基尼尔以剑相胁、以咒相逼，她终于允诺，约定九夜之后在森林中相会。"
    refs: [skaldskaparmal]
  - text: "弗雷为这一趟求亲失去了那柄能自行斩击的宝剑。诸神黄昏时他无兵可用，死于苏尔特尔之手。"
    refs: [gylfaginning]
variants:
  - claim: "求亲的完整过程见诗体埃达《斯基尼尔之歌》；《散文埃达》只把它当作典故提及，未详述威逼一节。"
    refs: [skaldskaparmal]
relations:
  - { target: freyr, kind: 婚姻, detail: 为其妻, refs: [skaldskaparmal] }
legacy:
  - 后世常以「以剑换爱」概括此事，其实那柄剑是被当作聘礼与威胁的工具送出去的。
