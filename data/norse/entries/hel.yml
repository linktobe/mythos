id: hel
pantheon: norse
entity_type: 神祇
name: 海拉
name_original: "Hel"
aliases: [赫尔]
summary: 洛基之女，统辖冥界，半数身躯已死。
role:
  title: "冥界的执掌者"
  brief: "收容因病、老而死的人，以冷酷的规则执行死亡秩序——其中包括拒绝把巴德尔还给诸神。"
identity:
  lineage: [jotunn, being]
  camp:
    - { id: hel }
  realm:
    - { id: helheim, note: 统辖者 }
narrative:
  - text: 洛基与安格尔波达之女。奥丁将她投入尼福尔海姆，命她统辖九界中因疾病与衰老而死的人。
    refs: [gylfaginning]
  - text: 她半身是生人的肤色，半身是死尸的乌黑；居所名埃柳德尼尔，餐盘名为 "饥饿"，餐刀名为 "饥荒"。
    refs: [gylfaginning]
variants:
  - claim: 她是否算 "巨人" 还是独立一类，原典未作明确区分；本站按血统记巨人，按政治身份记冥界。
    refs: [gylfaginning]
relations:
  - { target: loki, kind: 亲缘, detail: 父女, refs: [gylfaginning] }
  - { target: baldr, kind: 敌对, detail: 拒绝归还, refs: [gylfaginning] }
  - { target: fenrir, kind: 亲缘, detail: 兄妹, refs: [gylfaginning] }
  - { target: jormungandr, kind: 亲缘, detail: 兄妹, refs: [gylfaginning] }
legacy:
  - 现代作品常将其简化为 "死亡女神"，与原文中 "收容病死者" 的职能有出入。
adaptations:
  - work: "漫威电影宇宙《雷神3：诸神黄昏》（2017）"
    refs: [mcu-thor]
    kind: 电影
    portrayal: "奥丁的长女、索尔的姐姐，死亡女神；被囚禁多年后归来，徒手捏碎雷神之锤，最终与苏尔特尔同归于尽。"
    divergences:
      - "原典海拉是洛基与安格尔波达之女，与奥丁无血缘；MCU 改为奥丁长女，属彻底改写。"
      - "原典海拉统辖的是因病、老而死者所在的赫尔海姆；MCU 的她是征服者，与「收容亡者」的职能无关。"
      - "原典海拉半身生人肤色、半身死尸乌黑；MCU 采用全黑造型与鹿角冠，视觉上另起一路。"
