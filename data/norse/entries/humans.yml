id: humans
pantheon: norse
entity_type: 群体
name: 凡人
name_original: "Menn"
aliases: [人类, 世人]
summary: 居于米德加德的凡人，由诸神以海边漂木造成；神的战争与末日，对凡人而言就是世界本身。
role:
  title: "中间界的居民"
  brief: "神话里凡人几乎不发声，却是诸神一切作为的落点：他们拜神、被神考验，也在末日里活下来重开一局。"
identity:
  lineage:
    - { id: human }
  camp:
    - { id: human }
  realm:
    - { id: midgard }
narrative:
  - text: "最早的人由奥丁三兄弟以海边拾得的两棵树造成，名为阿斯克与恩布拉；三人分别赋予他们生命、心智与感官。"
    refs: [voluspa, gylfaginning]
  - text: "他们居于米德加德，四面环海，海中盘着一条自衔其尾的巨蟒。"
    refs: [gylfaginning]
  - text: "诸神与凡人的往来多是索取与考验；战事一起，凡人也卷入其中。"
    refs: [voluspa]
  - text: "末日之后，一男一女自晨露中醒来，重新繁衍，成为新世界的人。"
    refs: [voluspa]
relations:
  - { target: midgard, kind: 从属, detail: 所居之地, refs: [gylfaginning] }
  - { target: odin, kind: 从属, detail: 由其三兄弟以漂木造成, refs: [voluspa] }
