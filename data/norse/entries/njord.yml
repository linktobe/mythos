id: njord
pantheon: norse
entity_type: 神祇
name: 尼约德
name_original: "Njord"
aliases: [尼奥尔德, 海神]
summary: 华纳神族的海洋之神，两族议和时作为人质入阿萨。
role:
  title: "海与财富的赐予者"
  brief: "掌渔业与航运，是人与海之间的中介；作为议和人质入阿萨，象征两族的和解。"
identity:
  lineage: [vanir]
  camp:
    - { id: vanir, until: 两族议和 }
    - { id: aesir, from: 作为人质入阿斯加德 }
  realm:
    - { id: vanaheim, note: 出身 }
    - { id: asgard, note: 诺阿通 }
narrative:
  - text: 华纳神族，掌海与航海，司掌渔获与财富。两族议和后，他作为人质入阿萨神族。
    refs: [gylfaginning, vafthrudnismal]
    at: { vafthrudnismal: "38" }
  - text: 他与巨人斯卡蒂成婚，却因居所之争难以同住——她愿居山中，他愿居海边，终至分离。
    refs: [gylfaginning, skaldskaparmal, lokasenna]
variants:
  - claim: 《欺骗古鲁菲》把二人分离写成 "九天山中、九天海边" 的轮居失败；《诗语》侧重于婚事如何议成。
    refs: [gylfaginning, skaldskaparmal]
relations:
  - { target: freyja, kind: 亲缘, detail: 父女, refs: [gylfaginning] }
  - { target: freyr, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: skadi, kind: 婚姻, detail: 夫妻，后分离, refs: [skaldskaparmal] }
legacy:
  - 现代航海文化中常以其名命名船只，与原典无直接关联。
