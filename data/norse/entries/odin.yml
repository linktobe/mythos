id: odin
pantheon: norse
entity_type: 神祇
name: 奥丁
name_original: "Odin"
aliases: [众神之父, 独眼者, 高者]
summary: 阿萨神族之首，以自我献祭换取智慧与卢恩。
role:
  title: "众神之王"
  brief: "九界秩序的制定者与维护者。以一只眼睛与九夜自悬换取智慧与卢恩，用英灵殿囤积战力；明知诸神黄昏不可免，仍为之备战。"
identity:
  lineage: [aesir]
  camp:
    - { id: aesir }
  realm:
    - { id: asgard, note: 常居 }
narrative:
  - text: 阿萨神族之首。父为博尔，母为巨人贝斯特拉；他与兄弟维利、维共同杀死始祖巨人尤弥尔，以尤弥尔的身躯造成世界。
    refs: [gylfaginning]
  - text: 为求智慧，他将一只眼睛质押在巨人密米尔守护的泉水里；又自述曾悬挂于风摇之树九夜、以矛自刺，由此取得卢恩文字。
    refs: [gylfaginning, havamal]
  - text: 他居阿斯加德，坐高座俯瞰九界；两鸦胡金与穆宁每日飞巡报讯，两狼基利与弗雷基随行；持枪冈格尼尔，臂环德罗普尼尔每九夜生出九枚同重之环。
    refs: [grimnismal]
variants:
  - claim: 他与洛基的关系，《散文埃达》记为二人结为血兄弟；《洛基的争辩》中洛基亦以此自陈，但语气近乎要挟。
    refs: [lokasenna]
    at: { lokasenna: "9" }
  - claim: "中世纪的整理者另有一套说法：斯诺里在《散文埃达》序言里把诸神接到特洛伊的谱系上，《英格林格萨迦》更把奥丁写成从亚洲迁来的凡人君王。这不是原典的说法，而是基督徒执笔时的改造——读埃达时须记得这一层。"
    refs: [prose-edda-prologue, ynglingasaga]
relations:
  - { target: borr, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: bestla, kind: 亲缘, detail: 母子, refs: [gylfaginning] }
  - { target: vili, kind: 亲缘, detail: 兄弟, refs: [gylfaginning] }
  - { target: ve, kind: 亲缘, detail: 兄弟, refs: [gylfaginning] }
  - { target: thor, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: baldr, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: frigg, kind: 婚姻, detail: 夫妻, refs: [gylfaginning] }
  - { target: loki, kind: 血盟, detail: 结为血兄弟, refs: [lokasenna] }
  - { target: fenrir, kind: 宿命, detail: 诸神黄昏为其所吞, refs: [gylfaginning] }
# 子女总表：已立条的给 target，点进去就是那一页
kinship:
  - relation: 子
    name: 索尔
    name_original: "Thor"
    target: thor
    note: 母为大地女神约尔德。诸子中最重的一支，执雷锤守米德加德。
    refs: [gylfaginning]
  - relation: 子
    name: 巴德尔
    name_original: "Baldr"
    target: baldr
    note: 母为弗丽嘉。其死是诸神黄昏的起点。
    refs: [gylfaginning]
  - relation: 子
    name: 霍德尔
    name_original: "Hod"
    target: hodr
    note: 与巴德尔同母，双目失明；被洛基引着手投出槲寄生，亲手杀死兄弟。
    refs: [gylfaginning]
  - relation: 子
    name: 维达
    name_original: "Vidar"
    target: vidarr
    note: 母为女巨人格莉德。沉默而力强，末日中撕裂芬里尔为父报仇。
    refs: [skaldskaparmal]
  - relation: 子
    name: 瓦利
    name_original: "Vali"
    target: vali
    note: 母为女巨人琳达。甫生即长成，射杀霍德尔以偿巴德尔之命。
    refs: [gylfaginning]
  - relation: 子
    name: 赫尔莫德
    name_original: "Hermod"
    target: hermodr
    note: 母未详。骑斯雷普尼尔下冥界，向海拉求还巴德尔。
    refs: [gylfaginning]
legacy:
  - text: "瓦格纳《尼伯龙根的指环》以其为原型；漫威宇宙与《战神》（2018）另有大幅改写。"
    refs: [wagner-ring, mcu-thor, god-of-war-2018]
adaptations:
  - work: "漫威电影宇宙《雷神》系列（2011–2017）"
    refs: [mcu-thor]
    kind: 电影
    portrayal: "阿斯加德之王，索尔与洛基的父亲（洛基为养子）。在《雷神3》中被放逐至地球，于挪威海岸化作光点消散。"
    divergences:
      - "原典中奥丁与洛基是「结为血兄弟」的同辈，不是父子；MCU 改成养父子关系。"
      - "原典中奥丁死于诸神黄昏、被巨狼芬里尔吞下；MCU 改为衰老后自行消散。"
      - "原典中奥丁以独眼与九夜悬树换取智慧与卢恩；MCU 只保留独眼外形，抹掉了「以痛苦换知识」这层设定。"
      - "原典中海拉是洛基之女；MCU 把海拉改成奥丁的长女、索尔的姐姐。"
weapons:
  - name: 冈格尼尔
    name_original: "Gungnir"
    note: "长枪，掷出必中。奥丁曾以矛自刺、自悬于树以求卢恩；诸神的誓约也以此枪为证。"
    refs: [gylfaginning, havamal]
