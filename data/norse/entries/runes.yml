id: runes
pantheon: norse
entity_type: 器物
name: 卢恩
name_original: "Rúnar"
aliases: [卢恩文字, 卢恩字母, 如尼文]
summary: 刻在木、石与金属上的符号；既是文字，也是咒。传说由奥丁自悬九夜换来。
role:
  title: "刻痕即咒"
  brief: "在北欧，写字与施法不是两件事：把符号刻进东西里，它就会发作。这门手艺由奥丁以九夜的痛苦换来，再由一位女武神教给屠龙者。"
identity:
  lineage:
    - { id: aesir, note: "据《高者之歌》，诸神所造，奥丁取得" }
  camp:
    - { id: aesir, note: "诸神掌之；精灵、矮人、巨人与凡人的刻法都从此流出" }
  realm:
    - { id: asgard }
    - { id: midgard, note: "人间通晓者亦用之" }
narrative:
  - text: "奥丁自述：他被长矛刺伤，把自己献给自己，悬在那棵被风摇动的树上整整九夜；无人以面包与角杯接济他。他向下望，看见卢恩，呼喊着把它们拾起来，随即跌回原处。"
    refs: [havamal]
    at: { havamal: "139–140" }
  - text: "他说，从那时起自己才开始长成、得了智慧；诗里又说，卢恩是「歌者之王」亲手染色、强大的诸神亲手造出来的。"
    refs: [havamal]
    at: { havamal: "142–143" }
  - text: "这门手艺并非奥丁一人独占。诗里分派得清楚：奥丁为诸神写，达因为精灵写，德瓦林为矮人写，阿尔斯维德为巨人写，另有一部分是他自己写的。"
    refs: [havamal]
    at: { havamal: "144" }
  - text: "接着是一串连问：会不会刻，会不会解，会不会染色，会不会试；会不会求，会不会献，会不会送，会不会祭。刻只是第一步。"
    refs: [havamal]
    at: { havamal: "145" }
  - text: "成体系的刻法写在《希格德里法之歌》里：布伦希尔德在山上教齐格鲁德七种。胜利卢恩刻在剑柄上，刻罢要两次呼唤提尔；麦酒卢恩刻在角杯与手背上，指甲上写「需求」，防的是酒里被人做手脚；出生卢恩写在掌心与关节上，求命运女神相助；海浪卢恩刻在船首与舵上，再烧进桨里；枝干卢恩写在朝东的树皮上，用来治伤；言语卢恩用在庭上争讼；思想卢恩使人显得最有见识。"
    refs: [sigrdrifumal]
    at: { sigrdrifumal: "6–12" }
  - text: "同一篇里另有一段咒歌，数说该把卢恩写在哪里：遮太阳的那面盾、日车双马的耳与蹄、斯雷普尼尔的牙、熊掌、布拉吉的舌、狼爪、鹰喙、带血的翅膀、桥头、解缚的手与助人的足迹、玻璃与黄金、酒与麦酒、心爱的座位、冈格尼尔的枪尖、格拉尼的胸口、诺伦女神的指甲。"
    refs: [sigrdrifumal]
    at: { sigrdrifumal: "15–17" }
  - text: "还有一说：古时写下的卢恩被从木上刮下来，掺进圣蜜酒，远远送出去；于是诸神有了，精灵有了，华纳神族有了，凡人也分到一些。"
    refs: [sigrdrifumal]
    at: { sigrdrifumal: "18" }
  - text: "《斯基尼尔之歌》里，斯基尼尔对葛德不只是一通狠话：他写下咒符，外加三个卢恩，作用于情欲、疯狂与焦躁；紧接着又补一句，写下的还能刮掉，只要他觉得有必要。"
    refs: [skirnismol]
    at: { skirnismol: "37" }
variants:
  - claim: "《高者之歌》末尾列的是十八首编号的「歌」，第一首叫助力，第二首治伤——那是咒，不是十八个卢恩字母；通行的弗萨克字母表在这两首诗里都没有出现。"
    refs: [havamal]
  - claim: "《希格德里法之歌》的卢恩清单写到第七种就断了，抄本此处并无缺页标记；紧接着转入奥丁如何排列卢恩。清单是否原本就到这里，无从判断。"
    refs: [sigrdrifumal]
  - claim: "卢恩的来源不止一种讲法：《高者之歌》说是奥丁自悬九夜取得，《希格德里法之歌》说是古时写下的卢恩被刮下掺进圣蜜酒、分给诸族。二者都出自诗体埃达，谁也不覆盖谁。"
    refs: [havamal, sigrdrifumal]
relations:
  - { target: odin, kind: 从属, detail: 为其自悬九夜所得, refs: [havamal] }
  - { target: sigurd, kind: 从属, detail: 由布伦希尔德授其刻法, refs: [sigrdrifumal] }
  - { target: gungnir, kind: 从属, detail: 亦刻于其枪尖, refs: [sigrdrifumal] }
legacy:
  - 今天流行的卢恩占卜与「符文」纹身，多是十九世纪末以来重新编出来的体系；中世纪冰岛文献里记的是刻符施法，不曾提到抽签问卦。
  - 纳粹德国把卢恩符号用作党卫队等组织的标记，战后这些符号长期带有政治含义，与维京时代的用法无关。
adaptations:
  - work: "《战神》（2018）"
    kind: 游戏
    portrayal: "游戏把卢恩做成看得见的文字，也做成可装备的符文技能，二者共用一套符号。"
    divergences:
      - "原典的卢恩要刻在具体物件上才发作——剑柄、船首、树皮各有刻处；游戏把它抽象成可装备的技能，威力与刻在何处无关。"
      - "原典的卢恩由奥丁自残取得，代价是九夜悬树；游戏里它多是途中拾得的战利品。"
      - "原典的刻法分门别类，胜利、出生、海浪各有用途与刻处；游戏只保留「符号」这一层，不区分类别。"
