  - { target: hjordis, kind: 婚姻, detail: 夫妻, refs: [volsungasaga] }
  - { target: sigurd, kind: 亲缘, detail: 父子, refs: [volsungasaga] }
  - { target: sinfjotli, kind: 亲缘, detail: 父子, refs: [volsungasaga] }
  - { target: gram, kind: 从属, detail: 自树中拔出，死后碎片重铸为格拉姆, refs: [volsungasaga] }
  - { target: odin, kind: 宿命, detail: 剑为其所插，亦为其所折, refs: [volsungasaga] }
