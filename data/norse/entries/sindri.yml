id: sindri
pantheon: norse
entity_type: 矮人
name: 辛德里
name_original: "Sindri"
aliases: [埃特里]
summary: 矮人工匠，与兄弟布洛克合铸雷神之锤、德罗普尼尔与金鬃野猪。
role:
  title: "神器的铸造者"
  brief: "诸神最倚重的三件宝物都出自他的炉火：托尔的锤、奥丁的戒指、弗雷的野猪。洛基拿人头与他打赌，最后输了。"
identity:
  lineage:
    - { id: dwarf }
  camp:
    - { id: aesir, note: 为诸神造器 }
  realm:
    - { id: svartalfheim }
narrative:
  - text: "洛基以自己的人头与矮人辛德里打赌，赌他造不出比诸神手中更精良的宝物。"
    refs: [skaldskaparmal]
  - text: "辛德里与兄弟布洛克入炉，先后铸成三物：金鬃野猪古林布尔斯提、戒指德罗普尼尔，以及雷锤妙尔尼尔。"
    refs: [skaldskaparmal]
  - text: "三物各有其用：野猪赠弗雷，戒指赠奥丁，雷锤归托尔。洛基输了赌约，却以「头可给，脖子不可给」脱身。"
    refs: [skaldskaparmal]
variants:
  - claim: "此矮人在抄本中又作 Eitri（埃特里），Sindri 与 Eitri 是否同一人，各本记载不一。"
    refs: [skaldskaparmal]
relations:
  - { target: brokkr, kind: 亲缘, detail: 兄弟, refs: [skaldskaparmal] }
  - { target: mjolnir, kind: 从属, detail: 所铸, refs: [skaldskaparmal] }
  - { target: draupnir, kind: 从属, detail: 所铸, refs: [skaldskaparmal] }
  - { target: gullinbursti, kind: 从属, detail: 所铸, refs: [skaldskaparmal] }
  - { target: loki, kind: 敌对, detail: 赌约对手, refs: [skaldskaparmal] }
legacy:
  - 后世「矮人善铸神器」的印象，源头正是这一段。
