id: skadi
pantheon: norse
entity_type: 神祇
name: 斯卡蒂
name_original: "Skaði"
aliases: [斯卡迪, 滑雪女神]
summary: 巨人之女，携械入阿斯加德讨说法，后嫁尼约德。
role:
  title: "雪山与狩猎"
  brief: "代表巨人与神族和解的可能；与尼约德的婚姻失败，象征两种生活方式终究无法调和。"
identity:
  lineage: [jotunn]
  camp:
    - { id: jotnar, until: 与神族和解 }
    - { id: aesir, from: 和亲 }
  realm:
    - { id: jotunheim, note: 出身，Þrymheimr }
    - { id: asgard, note: 婚后期 }
narrative:
  - text: 巨人夏基之女。父亲被诸神所杀后，她披甲持械赶赴阿斯加德讨要说法，诸神以和解相待：允她择一神为夫，并令洛基逗她发笑。
    refs: [skaldskaparmal]
  - text: 她择夫时只看脚，误选尼约德；婚后二人因居所不合而分离。
    refs: [skaldskaparmal, grimnismal]
    at: { grimnismal: "11" }
variants:
  - claim: 分离后她另嫁奥丁之说见于《诗语》，但叙述简略，学界多存疑。
    refs: [skaldskaparmal]
relations:
  - { target: njord, kind: 婚姻, detail: 夫妻，后分离, refs: [skaldskaparmal] }
  - { target: loki, kind: 敌对, detail: 结怨于逗笑一节, refs: [skaldskaparmal] }
legacy:
  - 现代插画与游戏常以其 "雪山女神" 形象出场，多属再创作。
