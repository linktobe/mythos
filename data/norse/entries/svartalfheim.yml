id: svartalfheim
pantheon: norse
entity_type: 地区
name: 斯瓦塔尔法海姆
name_original: "Svartalfheim"
aliases: [黑暗精灵之国, 矮人之乡]
summary: 黑暗精灵与矮人所居的地下之界，诸神的神器多在此锻造。
role:
  title: "地下的作坊"
  brief: "九界里最像工坊的一界：不见天日，炉火不熄。锤、环、猪、船都从这里出来，诸神的武力其实长在这片地下。"
identity:
  lineage:
    - { id: dwarf, note: 矮人所居 }
  camp:
    - { id: neutral }
  realm:
    - { id: svartalfheim }
narrative:
  - text: "《欺骗古鲁菲》叙九界时提到此界，称黑暗精灵居之；同书又说矮人住在地下与石中。"
    refs: [gylfaginning]
  - text: "居于此地的是矮人与黑暗精灵。原典对二者是否同族，用词并不一致。"
    refs: [gylfaginning]
  - text: "此地不见天日。矮人在此设炉，为诸神铸出雷锤、臂环与金鬃野猪。"
    refs: [skaldskaparmal]
variants:
  - claim: "斯瓦塔尔法海姆与「尼达维利尔」是否同一地，学界与原文均无定论；二名常被交替使用。"
    refs: [gylfaginning]
relations:
  - { target: dvergar, kind: 从属, detail: 矮人所居, refs: [gylfaginning] }
  - { target: sindri, kind: 从属, detail: 在此设炉铸器, refs: [skaldskaparmal] }
legacy:
  - 现代作品里的「矮人地窟」多取材于此，原典只交代了居民与产物，未写地貌。
