id: valkyries
pantheon: norse
name: 女武神
name_original: "Valkyries"
aliases: [瓦尔基里]
entity_type: 群体
summary: 奥丁的侍女，在战场上拣选战死者，送往英灵殿。
role:
  title: "战死者的挑选者"
  brief: "她们决定谁倒在战场上、谁被带往英灵殿，平日在殿中为英灵奉酒。诸神黄昏的兵力，由她们一手挑选而成。"
identity:
  lineage:
    - { id: aesir, note: 多为其侍从 }
  camp:
    - { id: aesir }
  realm:
    - { id: asgard, note: 英灵殿 }
narrative:
  - text: "「女武神」一词意为「挑选战死者的人」。她们在战场上决定谁该死、谁该被带往英灵殿。"
    refs: [grimnismal]
  - text: "《格里姆尼尔之歌》列举其名，如 Skuld、Skögul、Hildr 等，数目与名目诸书不一；她们的日常职责之一，是在英灵殿中为英灵奉酒。"
    refs: [grimnismal, gylfaginning]
  - text: "《格里姆尼尔之歌》一口气列了十三位，赫里斯特、米斯特、斯凯格约尔德、斯库尔、希尔德……名字多半是「摇晃者」「迷雾」「持盾者」一类的称谓，而不是各有事迹的个人。她们在英灵殿里给英灵奉酒。"
    refs: [grimnismal]
    at: { grimnismal: "36" }
  - text: "名单还能再加：《诗语》之后所附的《名目表》另有一套，数目更多；《哈康之歌》《沃伦德之歌》《海尔吉》组诗里又各有几位露面。女武神是一个开放的集合，从来没有定本。"
    refs: [nafnathulur, hakonarmal, volundarkvitha]
variants:
  - claim: "有名未必有故事：名单上多数名字只出现一次，没有独立事迹。真有完整故事的只有布伦希尔德与希格露恩等少数几位；而布伦希尔德与《希格德里法之歌》里那位女武神是否同一人，原诗并没有明说。"
    refs: [grimnismal, sigrdrifumal, volsungasaga]
  - claim: "女武神的数目与名单各家记载不同，《格里姆尼尔之歌》所列与《诗语》所举并不一致；《诗语》之后所附的《名目表》又是另一套名单，抄本带不带这一节，数目就随之变化。"
    refs: [grimnismal, skaldskaparmal, nafnathulur]
  - claim: "希露德之父赫格尼，与《阿特利之歌》里古德伦之兄赫格尼只是同名，家世与事迹都不相干。北欧材料里同名不同人的情形不止这一处，读时须按篇分流。"
    refs: [skaldskaparmal, atlakvitha]
relations:
  - { target: odin, kind: 从属, detail: 奉其命拣选战死者, refs: [grimnismal] }
legacy:
  - text: "瓦格纳《尼伯龙根的指环》中的布伦希尔德即取材于女武神；漫威《雷神3》另设「瓦尔基里」一角。"
    refs: [wagner-ring, mcu-thor]
adaptations:
  - work: "漫威电影宇宙《雷神3：诸神黄昏》（2017）"
    refs: [mcu-thor]
    kind: 电影
    portrayal: "阿斯加德的女战士军团，被海拉屠杀殆尽；仅存的瓦尔基里（布伦希尔德）酗酒流落萨卡星，后随索尔归来。"
    divergences:
      - "原典中女武神是群体、是奥丁的侍女，负责在战场拣选战死者；MCU 把她们写成阿斯加德的常规军队。"
      - "原典的核心职能是「挑选谁进英灵殿」；MCU 完全没有这层宗教含义。"
      - "原典中布伦希尔德是独立的女武神形象；MCU 把她压缩成「最后一个幸存者」的叙事。"
profiles:
  - name: 希格露恩
    name_original: "Sigrun"
    story: "她与英雄海尔吉相爱成婚。海尔吉后来被她的兄弟达格所杀，她悲恸不已；诗中写他死后重生，二人再度相遇。这一组诗在诗体埃达中分前后两篇，结局各本不同。"
    refs: [helgakvida, helgakvitha-i]
  - name: 希露德
    name_original: "Hildr"
    story: "她的父亲赫格尼与她的情人赫丁交战，她每夜以魔法唤醒死者，令这场仗永远打不完——后世称「希露德之战」。她不属于英灵殿的挑选者，更像把战争本身留了下来的人。"
    refs: [skaldskaparmal]
  - name: 斯薇法
    name_original: "Svava"
    story: "海尔吉·赫约瓦尔松爱上她，二人成婚。她的父亲也叫埃利米，与齐格鲁德的外公同名不同人。海尔吉后来被阿尔夫所杀，她在诗中悲恸不已。"
    refs: [helgakvitha-hjorvarthssonar]
  - name: 卡拉
    name_original: "Kara"
    story: "同一篇末尾的散文说，海尔吉与斯薇法转生为「海尔吉·哈丁加斯卡提」与女武神卡拉，再演一遍同样的故事；抄本在这里注了一句，称这段为「老妇人的闲谈」。"
    refs: [helgakvitha-hjorvarthssonar]
  - name: 贡杜尔与诗嘉古尔
    name_original: "Gondul and Skogul"
    story: "《哈康之歌》里，奥丁派这两人到诸王之间挑选；她们披甲执矛找到战死的哈康王，与死者有一场问答。这是女武神在诗里真正开口说话的一处。"
    refs: [hakonarmal]
  - name: 三位天鹅少女
    name_original: "Alftir"
    story: "《沃伦德之歌》开场，三位女子披天鹅羽衣飞来，在湖边纺织，与沃伦德兄弟结为夫妻，七年后飞走。诗里说她们是女武神，却没给她们一个挑选战死者的场面——在这里她们更像会飞的外来者。"
    refs: [volundarkvitha]
