id: yggdrasil
pantheon: norse
entity_type: 器物
name: 世界树
name_original: "Yggdrasil"
aliases: [宇宙树, 乾坤树]
summary: 撑起九界的白蜡树，诸神每日在树下议事，树根下盘着龙与蛇。
role:
  title: "九界之轴"
  brief: "九界不是并列的九个房间，而是挂在同一棵树上的枝、干与根。它的存亡与诸神的存亡同步。"
identity:
  lineage:
    - { id: being, note: 巨木，非神非人 }
  camp:
    - { id: neutral }
  realm:
    - { id: beyond, note: 不在九界之内，九界悬于其上 }
narrative:
  - text: "此树为白蜡，三根巨根各通一处：一根伸向诸神，一根伸向霜巨人，一根伸向尼福尔海姆。三根之下各有一泉。"
    refs: [gylfaginning]
  - text: "三泉各有名目。伸向诸神的一根下面是乌尔德泉，诺伦三女神每日从泉中取水浇树；伸向巨人的一根下面是密米尔之泉，奥丁把一只眼睛押在那里换智慧；伸向尼福尔海姆的一根下面是赫瓦格密尔，诸河都从那里流出，龙与群蛇在泉中啃啮。"
    refs: [voluspa, grimnismal, gylfaginning]
    at: { voluspa: "19–20、27", grimnismal: "26" }
  - text: "树顶立一鹰，鹰与根下的龙之间，有一只叫拉塔托斯克的松鼠往返传话，彼此搬弄是非。"
    refs: [grimnismal]
  - text: "四头鹿在枝间啃食嫩芽；尼德霍格与群蛇在根下啃啮，从底下把世界一点点掏空。"
    refs: [grimnismal]
  - text: "诸神每日在此树下议事、断案——九界的秩序是在这棵树的荫下决定的。"
    refs: [grimnismal]
  - text: "奥丁曾自悬于此树九夜，以矛自刺，换来卢恩的文字。树因此又名「奥丁的绞架」。"
    refs: [havamal]
variants:
  - claim: "三泉与三根的对应，是《欺骗古鲁菲》给出的；诗体埃达分别提到这些泉与水，却没有把它们一一挂到根上。读者若把「三根三泉」当成诗里的原话，其实是把两处文本合并了。"
    refs: [grimnismal, gylfaginning]
relations:
  - { target: nidhogg, kind: 从属, detail: 龙在其根下啃啮, refs: [grimnismal] }
  - { target: nornir, kind: 从属, detail: 三女神在树下之泉边定命, refs: [gylfaginning] }
  - { target: odin, kind: 从属, detail: 奥丁自悬于此树九夜求得卢恩, refs: [havamal] }
legacy:
  - 现代常被画成「九界连接图」的视觉符号；原典里的它是活的，有鹿、蛇、鹰与松鼠在动。
