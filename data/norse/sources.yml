# 原典登记表
# tier: T0 = 原典（诗体埃达等同期诗歌）；T1 = 古代汇编/系统化整理（散文埃达等）
# 规则：叙事主干只引用 T0/T1；T2/T3 只能出现在 legacy 字段。
# 引文一律"原文 + 自译"，不抄现代中译本。url 指向公有领域原文库，供读者核对。

- id: voluspa
  pantheon: norse
  tier: T0
  title: 女巫的预言
  original: Völuspá
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪，抄本约 1270
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/voluspo
  note: 创世与诸神黄昏的骨架，全诗约 66 节。

- id: havamal
  pantheon: norse
  tier: T0
  title: 高者之歌
  original: Hávamál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 9–10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/hovamol
  note: 处世格言为主体；第 138–145 节为奥丁自述取得卢恩。

- id: grimnismal
  pantheon: norse
  tier: T0
  title: 格里姆尼尔之歌
  original: Grímnismál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/grimnismol
  note: 以奥丁自述形式铺陈九界与诸神居所，是地理信息最密集的一篇。

- id: lokasenna
  pantheon: norse
  tier: T0
  title: 洛基的争辩
  original: Lokasenna
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/lokasenna
  note: 洛基逐一辱骂诸神，含其自陈杀死巴德尔。

- id: baldrs-draumar
  pantheon: norse
  tier: T0
  title: 巴德尔的梦
  original: Baldrs draumar
  work: 诗体埃达
  work_original: Poetic Edda (AM 748 I 4to)
  date: 约 10–11 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/baldrs-draumar
  note: 奥丁赴冥界问卜巴德尔之死，无槲寄生情节。

- id: hymiskvida
  pantheon: norse
  tier: T0
  title: 希米尔之歌
  original: Hymiskviða
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/hymiskvitha
  note: 索尔钓起尘世巨蟒的原始叙述。

- id: gylfaginning
  pantheon: norse
  tier: T1
  title: 欺骗古鲁菲
  original: Gylfaginning
  work: 散文埃达
  work_original: Prose Edda
  date: 约 1220
  lang: 古诺斯语
  author: Snorri Sturluson
  url: https://sacred-texts.com/book/the-prose-edda/gylfaginning
  note: 现存最完整的北欧神话叙述，但作者为基督徒，成书晚于基督教化两百年。

- id: skaldskaparmal
  pantheon: norse
  tier: T1
  title: 诗语
  original: Skáldskaparmál
  work: 散文埃达
  work_original: Prose Edda
  date: 约 1220
  lang: 古诺斯语
  author: Snorri Sturluson
  url: https://sacred-texts.com/book/the-prose-edda/skaldskaparmal
  note: 以问答形式解释神话典故与诗体用语。

- id: sigrdrifumal
  pantheon: norse
  tier: T0
  title: 希格德里法之歌
  original: Sigrdrífumál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10–11 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/sigrdrifumol
  note: 齐格鲁德唤醒被囚的女武神，她授以卢恩与处世之诫。原文见该诗集目录。

- id: helgakvida
  pantheon: norse
  tier: T0
  title: 海尔吉·亨丁斯巴纳之歌（第二篇）
  original: Helgakviða Hundingsbana
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10–11 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/helgakvitha-hundingsbana-ii
  note: 女武神希格露恩与英雄海尔吉的故事，分前后两篇。原文见该诗集目录。

- id: thrymskvida
  pantheon: norse
  tier: T0
  title: 索列姆之歌
  original: Þrymskviða
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/thrymskvitha
  note: 索尔扮作新娘取回雷锤，全篇近于闹剧，是雷神少见的滑稽场面。

- id: vafthrudnismal
  pantheon: norse
  tier: T0
  title: 瓦夫斯鲁德尼尔之歌
  original: Vafþrúðnismál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/vafthruthnismol
  note: 奥丁与智者瓦夫斯鲁德尼尔斗智问答；末段记末日之后马格尼与莫迪继承雷锤。
- id: reginsmol
  pantheon: norse
  tier: T0
  title: 雷金的歌
  original: Reginsmál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/reginsmol
  note: 前半为水獭的赎金与安德瓦利的诅咒，后半为雷金教齐格鲁德、铸格拉姆。

- id: fafnismol
  pantheon: norse
  tier: T0
  title: 法夫纳之歌
  original: Fáfnismál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/fafnismol
  note: 屠龙一节的核心文本；法夫纳垂死时与齐格鲁德论命运，后附鸟语与斩雷金。

- id: sigurtharkvitha
  pantheon: norse
  tier: T0
  title: 齐格鲁德之歌（短）
  original: Sigurðarkviða in skamma
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/sigurtharkvitha-en-skamma
  note: 布伦希尔德与齐格鲁德的悲剧全貌，含她自尽一节。

- id: brot-sigurtharkvithu
  pantheon: norse
  tier: T0
  title: 齐格鲁德之歌残篇
  original: Brot af Sigurðarkviðu
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/brot-af-sigurtharkvithu
  note: 只存后半，记林中行刺与布伦希尔德的发难。

- id: guthrunarkvitha
  pantheon: norse
  tier: T0
  title: 古德伦之歌
  original: Guðrúnarkviða in fyrsta
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/guthrunarkvitha-i
  note: 古德伦在齐格鲁德尸前的悲恸，是全集里最集中的一段哭丧。

- id: atlakvitha
  pantheon: norse
  tier: T0
  title: 阿特利之歌
  original: Atlakviða in grœnlenzka
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 9 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/atlakvitha-en-gronlenzka
  note: 尼伯龙根宝藏的下落与古德伦复仇，风格在诗体埃达中最古拙冷硬。
- id: skirnismol
  pantheon: norse
  tier: T0
  title: 斯基尼尔之歌
  original: Skírnismál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/skirnismol
  note: 弗雷遣斯基尼尔向葛德求婚，剑由此送出；是弗雷唯一有完整篇章的故事。
- id: volundarkvitha
  pantheon: norse
  tier: T0
  title: 沃伦德之歌
  original: Völundarkviða
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/volundarkvitha
  note: 匠人复仇的故事，风格近于民间传说，与诸神主线相对独立。

- id: rigsthula
  pantheon: norse
  tier: T0
  title: 里格的歌
  original: Rígsþula
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/rigsthula
  note: 以海姆达尔化名里格游历人间，解释奴隶、自由民与贵族三等级的来历。

- id: alvissmol
  pantheon: norse
  tier: T0
  title: 阿尔维斯之歌
  original: Alvíssmál
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/alvissmol
  note: 索尔以通宵问难拖住矮人，等日出将其化为石头。

- id: harbarthsljoth
  pantheon: norse
  tier: T0
  title: 哈尔巴德之歌
  original: Hárbarðsljóð
  work: 诗体埃达
  work_original: Poetic Edda (Codex Regius)
  date: 约 10 世纪
  lang: 古诺斯语
  url: https://sacred-texts.com/book/the-poetic-edda/harbarthsljoth
  note: 索尔与渡口船夫互揭短处的一篇对话诗，是全集里对诸神最不敬的一首。

