  abstract: true

- id: giant
  zh: 巨人族
  en: Giants
  pantheon: norse
  abstract: true

- id: elf
  zh: 精灵
  en: Elves
  pantheon: norse
  abstract: true

- id: mortal
  zh: 凡人
  en: Mortals
  pantheon: norse
  abstract: true

- id: other
  zh: 其他
  en: Other
  pantheon: norse
  abstract: true
