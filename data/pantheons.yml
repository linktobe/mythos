# 体系注册表（唯一真源）
#
# 全站有几套神话、每套叫什么、有哪些列表页、关系图以谁为中心，全部写在这里。
# 新增一套体系＝在这里加一条 + 建 data/<id>/ 目录，不改 schema、不改页面代码。
#
# 字段：
#   id            稳定标识，也是 URL 前缀（/norse/、/japanese/）
#   zh / en       显示名
#   status        live = 已上线；planned = 已登记、还没有内容（不进构建、不出路由）
#   accent        辅助色，覆盖全站 --accent
#   description   体系简介，用在该体系首页
#   tier_note     T0/T1 在本体系里各指哪一类文本（各体系不同，不能全局硬编码）
#   axes          本体系启用的身份轴，取值范围 lineage / camp / realm
#   graph_center  关系图中心词条 id
#   sections      列表页配置；types 里列出的类别即为本体系启用项
#   order         排序用的固定顺序（避免每页各写一份数组）

- id: norse
  zh: 北欧神话
  en: Norse
  status: live
  accent: '#9c3b2e'
  description: 以《诗体埃达》与《散文埃达》为主干。异说并列，各著出处。
  tier_note:
    T0: 诗体埃达及同期诗歌（含萨迦中的插诗）
    T1: 斯诺里《散文埃达》、冰岛萨迦与丹麦、德意志的拉丁文史书等古代整理
  axes: [lineage, camp, realm]
  relation_kinds: [亲缘, 血盟, 婚姻, 敌对, 宿命, 从属, 师承, 化生, 同源]
  graph_center: odin
  sections:
    - key: entry
      label: 词条
      desc: 神祇、巨人、矮人、异兽
      route: ''
      types: [神祇, 巨人, 矮人, 异兽]
    - key: legend
      label: 英雄传说
      desc: 屠龙者与尼伯龙根的黄金
      route: yingxiong
      types: [英雄]
    - key: group
      label: 群体
      desc: 族群与军团
      route: qun
      types: [群体]
    - key: object
      label: 器物
      desc: 兵刃、宝物与桥
      route: qi
      types: [器物]
    - key: place
      label: 地区
      desc: 九界与它们的来历
      route: di
      types: [地区]
    - key: event
      label: 事件
      desc: 把人物串成时间线
      route: shi
      types: [事件]
  order:
    group: [aesir, vanir, jotnar, dvergar, humans, beasts, valkyries, nornir]
    place: [asgard, vanaheim, alfheim, midgard, jotunheim, svartalfheim, muspelheim, niflheim, helheim]
    event: [creation, aesir-vanir-war, mead-theft, idunn-apples, hammer-theft, thors-fishing, utgarda-trials, hrungnir-duel, baldr-death, loki-binding, ragnarok, rebirth, hjadingavig, volundr-revenge, sigurd-death, gudrun-revenge]

- id: japanese
  zh: 日本神话
  en: Japanese
  status: live
  accent: '#7a5a86'
  description: 以《古事记》《日本书纪》为主干。异传并列，各著出处。
  tier_note:
    T0: 古事记、日本书纪
    T1: 出云国风土记、古语拾遗、先代旧事本纪、延喜式祝词等古代记录与整理
  # 记纪的三层空间（高天原／苇原中国／黄泉）比北欧还清楚，故三轴全开。
  axes: [lineage, camp, realm]
  relation_kinds: [亲缘, 婚姻, 从属, 敌对, 宿命, 分灵, 御灵, 化生, 同源]
  graph_center: amaterasu
  sections:
    - key: entry
      label: 神祇
      desc: 记纪所载诸神
      route: ''
      types: [神祇]
    - key: group
      label: 群体
      desc: 别天神、神世七代与诸神之群
      route: qun
      types: [群体]
    - key: object
      label: 器物
      desc: 神器与诸宝
      route: qi
      types: [器物]
    - key: place
      label: 地区
      desc: 高天原、苇原中国与黄泉
      route: di
      types: [地区]
    - key: event
      label: 事件
      desc: 从国生み到让国
      route: shi
      types: [事件]
  order:
    entry: [izanagi, izanami, kagutsuchi, amaterasu, tsukuyomi, susanoo, takamimusubi, ooyamatsumi, okuninushi, suseri-bime, sukunabikona, ninigi, konohanasakuya, sarutahiko, watatsumi, toyotama, hoderi, hoori, tamayori, ugayafukiaezu]
    group: [betten, kamiyo-nanayo, yaoyorozu, yasogami]
    place: [takamagahara, ashihara, yomi, ne-no-kuni]
    event: [kuniumi, kamiumi, yomi-visit, misogi, amano-iwato, inaba-hare, kuniyuzuri, tenson-korin, umisachi-yamasachi]

- id: greco-roman
