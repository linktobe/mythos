id: brokkr
pantheon: norse
entity_type: 矮人
name: 布洛克
name_latin: "Brokkr"
aliases: [勃洛克]
summary: 矮人工匠，辛德里之弟，铸器时掌炉鼓风。
role:
  title: "炉边的守火人"
  brief: "兄长设计，他鼓风。洛基化作牛虻叮在他眼皮上，血糊住眼睛他也没有停手，三件宝物才得以成形。"
identity:
  lineage:
    - { id: dwarf }
  camp:
    - { id: aesir, note: 为诸神造器 }
  realm:
    - { id: svartalfheim }
narrative:
  - text: "铸器时由辛德里掌炉、布洛克鼓风。洛基化为牛虻，先叮手臂，再叮脖颈，最后叮在眼皮上；血流进眼睛，他仍不停手。"
    refs: [skaldskaparmal]
  - text: "正因他未曾停手，炉中之物才得成形；雷锤的柄略短一截，是洛基最后一叮所致。"
    refs: [skaldskaparmal]
relations:
  - { target: sindri, kind: 亲缘, detail: 兄弟, refs: [skaldskaparmal] }
  - { target: mjolnir, kind: 从属, detail: 所铸, refs: [skaldskaparmal] }
  - { target: loki, kind: 敌对, detail: 铸器时受其阻挠, refs: [skaldskaparmal] }
legacy:
  - 现代作品里的「矮人工匠」形象，多由他与辛德里这一对兄弟而来。
