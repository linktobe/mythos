id: odin
pantheon: norse
entity_type: 神祇
name: 奥丁
name_latin: "Óðinn"
aliases: [众神之父, 独眼者, 高者]
summary: 阿萨神族之首，以自我献祭换取智慧与卢恩。
role:
  title: "众神之王"
  brief: "九界秩序的制定者与维护者。以一只眼睛与九夜自悬换取智慧与卢恩，用英灵殿囤积战力；明知诸神黄昏不可免，仍为之备战。"
identity:
  lineage: [aesir]
  camp:
    - { id: aesir }
  realm:
    - { id: asgard, note: 常居 }
narrative:
  - text: 阿萨神族之首。父为博尔，母为巨人贝斯特拉；他与兄弟维利、维共同杀死始祖巨人尤弥尔，以尤弥尔的身躯造成世界。
    refs: [gylfaginning]
  - text: 为求智慧，他将一只眼睛质押在巨人密米尔守护的泉水里；又自述曾悬挂于风摇之树九夜、以矛自刺，由此取得卢恩文字。
    refs: [gylfaginning, havamal]
  - text: 他居阿斯加德，坐高座俯瞰九界；两鸦胡金与穆宁每日飞巡报讯，两狼基利与弗雷基随行；持枪冈格尼尔，臂环德罗普尼尔每九夜生出九枚同重之环。
    refs: [grimnismal]
variants:
  - claim: 他与洛基的关系，《散文埃达》记为二人结为血兄弟；《洛基的争辩》中洛基亦以此自陈，但语气近乎要挟。
    refs: [lokasenna]
relations:
  - { target: thor, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: baldr, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: frigg, kind: 婚姻, detail: 夫妻, refs: [gylfaginning] }
  - { target: loki, kind: 血盟, detail: 结为血兄弟, refs: [lokasenna] }
  - { target: fenrir, kind: 宿命, detail: 诸神黄昏为其所吞, refs: [gylfaginning] }
legacy:
  - 瓦格纳《尼伯龙根的指环》以其为原型；漫威宇宙与《战神》（2018）另有大幅改写。
adaptations:
  - work: "漫威电影宇宙《雷神》系列（2011–2017）"
    kind: 电影
    portrayal: "阿斯加德之王，托尔与洛基的父亲（洛基为养子）。在《雷神3》中被放逐至地球，于挪威海岸化作光点消散。"
    divergences:
      - "原典中奥丁与洛基是「结为血兄弟」的同辈，不是父子；MCU 改成养父子关系。"
      - "原典中奥丁死于诸神黄昏、被巨狼芬里尔吞下；MCU 改为衰老后自行消散。"
      - "原典中奥丁以独眼与九夜悬树换取智慧与卢恩；MCU 只保留独眼外形，抹掉了「以痛苦换知识」这层设定。"
      - "原典中海拉是洛基之女；MCU 把海拉改成奥丁的长女、托尔的姐姐。"
