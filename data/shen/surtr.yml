id: surtr
pantheon: norse
name: 苏尔特尔
aliases: [Surtr, 火巨人]
entity_type: 巨人
summary: 火之界穆斯贝尔海姆的统治者，诸神黄昏时携火而来，烧尽世界。
role:
  title: "末日的纵火者"
  brief: "他不参与诸神与巨人之间的日常争斗，只在最后登场：手持火焰之剑自南方而来，杀死弗雷，放火烧掉整个九界。"
identity:
  lineage: [jotunn]
  camp:
    - { id: hostile }
  realm:
    - { id: muspelheim, note: 统辖者 }
narrative:
  - text: "他居于火之界穆斯贝尔海姆，持一柄火焰之剑。"
    refs: [gylfaginning]
  - text: "《女巫的预言》记其自南方而来，剑光如太阳，山岩相撞，诸神与他交战而败。"
    refs: [voluspa]
  - text: "他与弗雷交战，并将弗雷杀死——彼时弗雷早已在求娶女巨人葛德时失去了自己的宝剑。此后，他放火焚尽世界。"
    refs: [gylfaginning]
variants:
  - claim: "苏尔特尔与弗雷交战的细节主要在《欺骗古鲁菲》；《女巫的预言》只写到火自南方来、烧尽大地，不及交战双方。"
    refs: [gylfaginning, voluspa]
relations:
  - { target: freyr, kind: 敌对, detail: 交战并将其杀死, refs: [gylfaginning] }
legacy:
  - 漫威《雷神3：诸神黄昏》以其为触发末日的一方；《战神：诸神黄昏》另作一套改写。
adaptations:
  - work: "漫威电影宇宙《雷神3：诸神黄昏》（2017）"
    kind: 电影
    portrayal: "被奥丁封印的火巨人，头颅与王冠被托尔取走；最终借永恒之火重获完整之身，将阿斯加德烧成废墟。"
    divergences:
      - "原典中苏尔特尔是火之界之主、诸神黄昏的主角之一；MCU 把他写成一件被各方利用的工具。"
      - "原典中他杀死弗雷；MCU 没有弗雷一角，这层因果整段消失。"
      - "原典中他烧的是整个世界；MCU 中被毁的只有阿斯加德这一块地方。"
