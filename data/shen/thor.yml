id: thor
pantheon: norse
name: 托尔
aliases: [雷神, 索尔]
summary: 阿萨神族的武力担当，与尘世巨蟒互为宿命。
role:
  title: "神族与人间的武力屏障"
  brief: "守护米德加德、抵御巨人，是诸神在正面战场上的主战力；也是末日里唯一能与尘世巨蟒同归于尽的力量。"
identity:
  lineage: [aesir, jotunn]
  camp:
    - { id: aesir }
  realm:
    - { id: asgard }
narrative:
  - text: 奥丁之子，母为大地女神约尔德（本属巨人）。掌雷锤妙尔尼尔，配力之腰带与铁手套，是神族与人间最主要的武力。
    refs: [gylfaginning]
  - text: 他与尘世巨蟒耶梦加得结怨于一次垂钓：以牛头为饵将巨蟒钓至船边，同行的巨人希米尔惊恐割断钓线，巨蟒脱钩入海。
    refs: [hymiskvida]
  - text: 诸神黄昏时他与耶梦加得互杀，中毒身亡；其子马格尼与莫迪继承雷锤。
    refs: [voluspa, gylfaginning]
variants:
  - claim: 钓蛇一节，《希米尔之歌》写托尔已举锤欲击而线断；《欺骗古鲁菲》则补入巨人希米尔因恐惧而割线的动机。
    refs: [hymiskvida, gylfaginning]
relations:
  - { target: odin, kind: 亲缘, detail: 父子, refs: [gylfaginning] }
  - { target: jormungandr, kind: 宿命, detail: 诸神黄昏互杀, refs: [voluspa] }
  - { target: loki, kind: 敌对, detail: 屡受其欺, refs: [gylfaginning] }
legacy:
  - 英语 Thursday 源自其名；漫威塑造为幽默英雄；《战神》（2018）中为可交战对象。
adaptations:
  - work: "漫威电影宇宙《雷神》系列与《复仇者联盟》系列（2011–2022）"
    kind: 电影
    portrayal: "雷霆之神、阿斯加德王子；从傲慢的继承者，成长为失去父亲、弟弟与锤子的流浪者，叙事大量喜剧化。"
    divergences:
      - "MCU 把「神」解释为高度发达的外星种族，人类祖先误认其为神；原典中神就是神，不需要科学化解释。"
      - "原典托尔的核心是对巨人的长期战争，以及与尘世巨蟒耶梦加得的宿命互杀；MCU 里这两个对手都不存在。"
      - "原典托尔有妻子西芙、情人女巨人雅恩莎萨，生子马格尼与莫迪；MCU 中西芙只是战友，子嗣线完全删除。"
      - "原典托尔直率、屡受洛基捉弄；MCU 保留这点，但加入大量自嘲式幽默，使其更接近超级英雄而非神祇。"
